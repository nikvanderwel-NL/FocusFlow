    // Datum hulpfuncties
    function toDateStr(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(str) {
      if (!str) return null;
      const [y, m, d] = str.split("-").map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }

    function addDaysStr(dateStr, days) {
      const base = parseDateStr(dateStr) || new Date();
      base.setDate(base.getDate() + days);
      return toDateStr(base);
    }

    function addMonthsStr(dateStr, months) {
      const base = parseDateStr(dateStr) || new Date();
      const targetDay = base.getDate();
      base.setDate(1);
      base.setMonth(base.getMonth() + months);
      const maxDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
      base.setDate(Math.min(targetDay, maxDay));
      return toDateStr(base);
    }

    function isRecurringTask(task) {
      return Boolean(task && task.recurrence && task.recurrence.type && task.recurrence.type !== "none");
    }

    function computeNextDueDate(task, completedDateStr) {
      const rec = task.recurrence;
      if (!rec || rec.type === "none") return null;

      const mode = rec.mode || "from_completion";
      const anchorStr = mode === "from_due" && task.targetDate ? task.targetDate : completedDateStr;

      if (rec.type === "daily") {
        return addDaysStr(anchorStr, 1);
      }

      if (rec.type === "weekdays") {
        let candidate = addDaysStr(anchorStr, 1);
        while ([0, 6].includes(parseDateStr(candidate).getDay())) {
          candidate = addDaysStr(candidate, 1);
        }
        return candidate;
      }

      if (rec.type === "weekly") {
        return addDaysStr(anchorStr, 7);
      }

      if (rec.type === "biweekly") {
        return addDaysStr(anchorStr, 14);
      }

      if (rec.type === "monthly") {
        return addMonthsStr(anchorStr, 1);
      }

      if (rec.type === "custom") {
        const interval = Math.max(1, Number(rec.interval) || 1);
        const unit = rec.unit || "days";
        if (unit === "days") return addDaysStr(anchorStr, interval);
        if (unit === "weeks") return addDaysStr(anchorStr, interval * 7);
        if (unit === "months") return addMonthsStr(anchorStr, interval);
      }

      return addDaysStr(anchorStr, 7);
    }

    function formatRecurrenceLabel(rec) {
      if (!rec || rec.type === "none") return "";
      const modeSuffix = rec.mode === "from_due" ? " (vaste cadans)" : " (vanaf afronden)";
      if (rec.type === "daily") return "Dagelijks" + modeSuffix;
      if (rec.type === "weekdays") return "Werkdagen (ma–vr)" + modeSuffix;
      if (rec.type === "weekly") return "Wekelijks" + modeSuffix;
      if (rec.type === "biweekly") return "Elke 2 weken" + modeSuffix;
      if (rec.type === "monthly") return "Maandelijks" + modeSuffix;
      if (rec.type === "custom") {
        const n = Math.max(1, Number(rec.interval) || 1);
        const unitMap = {
          days: n === 1 ? "dag" : "dagen",
          weeks: n === 1 ? "week" : "weken",
          months: n === 1 ? "maand" : "maanden"
        };
        return `Elke ${n} ${unitMap[rec.unit || "days"]}` + modeSuffix;
      }
      return "";
    }

    function formatDutchDate(dateStr, todayStr) {
      if (!dateStr) return "Geen datum";
      const tomorrowStr = addDaysStr(todayStr, 1);
      const yesterdayStr = addDaysStr(todayStr, -1);
      if (dateStr === todayStr) return "Vandaag";
      if (dateStr === tomorrowStr) return "Morgen";
      if (dateStr === yesterdayStr) return "Gisteren";

      const d = parseDateStr(dateStr);
      if (!d) return dateStr;
      return d.toLocaleDateString("nl-NL", {
        weekday: "short",
        day: "numeric",
        month: "short"
      });
    }

    function formatFullDutchDate(dateStr) {
      const d = parseDateStr(dateStr);
      if (!d) return dateStr;
      return d.toLocaleDateString("nl-NL", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function formatDateTimeNL(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return isoStr;
      return d.toLocaleString("nl-NL", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatTimeOnlyNL(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("nl-NL", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    // Veilige Markdown-renderer voor notities (bullets, nummering, koppen, afbeeldingen, opmaak)
    function isSafeImageUrl(url) {
      if (!url || typeof url !== "string") return false;
      const trimmed = url.trim();
      if (
        trimmed.startsWith("https://") ||
        trimmed.startsWith("http://") ||
        trimmed.startsWith("/") ||
        trimmed.startsWith("data:image/")
      ) {
        return true;
      }
      return false;
    }

    function escapeHtmlText(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderInlineMarkdown(text) {
      let html = escapeHtmlText(text);
      // Plaatjes: ![alt](url)
      html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (match, alt, src) => {
        if (!isSafeImageUrl(src)) return match;
        const safeSrc = src.replace(/"/g, "&quot;");
        return `<img src="${safeSrc}" alt="${alt}" loading="lazy" class="my-2 max-h-56 max-w-full rounded-xl border border-slate-200 dark:border-slate-700 object-contain" onerror="this.onerror=null;this.src='https://placehold.co/480x240/e2e8f0/475569?text=Afbeelding+niet+beschikbaar';" />`;
      });
      // Links: [tekst](url)
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (match, label, href) => {
        const safeHref = href.replace(/"/g, "&quot;");
        return `<a href="${safeHref}" target="_blank" rel="noopener noreferrer" class="underline text-indigo-600 dark:text-indigo-400 hover:opacity-80">${label}</a>`;
      });
      // Bold & italic & inline code
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      html = html.replace(/`([^`]+)`/g, '<code class="rounded bg-slate-200/80 px-1 py-0.5 font-mono text-[11px] dark:bg-slate-800">$1</code>');
      return html;
    }

    function renderNotesMarkdownHtml(markdownStr) {
      if (!markdownStr || !markdownStr.trim()) return "";
      try {
        if (window.marked && typeof window.marked.parse === "function") {
          const rawHtml = window.marked.parse(markdownStr, { breaks: true, gfm: true });
          const container = document.createElement("div");
          container.innerHTML = rawHtml;

          // Verwijder eventuele gevaarlijke scripts/event-handlers en beveilig afbeeldingen & links
          container.querySelectorAll("script, iframe, object, embed").forEach((el) => el.remove());
          container.querySelectorAll("*").forEach((el) => {
            Array.from(el.attributes).forEach((attr) => {
              if (attr.name.toLowerCase().startsWith("on")) {
                el.removeAttribute(attr.name);
              }
            });
          });
          container.querySelectorAll("a").forEach((a) => {
            const href = a.getAttribute("href") || "";
            if (!href.startsWith("https://") && !href.startsWith("http://")) {
              a.removeAttribute("href");
            } else {
              a.setAttribute("target", "_blank");
              a.setAttribute("rel", "noopener noreferrer");
            }
          });
          container.querySelectorAll("img").forEach((img) => {
            const src = img.getAttribute("src") || "";
            if (!isSafeImageUrl(src)) {
              img.remove();
              return;
            }
            img.setAttribute("loading", "lazy");
            img.setAttribute(
              "onerror",
              "this.onerror=null;this.src='https://placehold.co/480x240/e2e8f0/475569?text=Afbeelding+niet+beschikbaar';"
            );
          });

          return container.innerHTML;
        }
      } catch (e) {}

      // Fallback parser voor bullets, nummering, koppen en afbeeldingen
      const lines = markdownStr.split(/\r?\n/);
      const parts = [];
      let listMode = null; // null | 'ul' | 'ol'

      for (const rawLine of lines) {
        const line = rawLine.trim();
        const bulletMatch = line.match(/^[-*+]\s+(.*)$/);
        const orderedMatch = line.match(/^\d+\.\s+(.*)$/);

        if (bulletMatch) {
          if (listMode !== "ul") {
            if (listMode === "ol") parts.push("</ol>");
            parts.push('<ul class="my-1.5 list-disc pl-5 space-y-1">');
            listMode = "ul";
          }
          parts.push(`<li>${renderInlineMarkdown(bulletMatch[1])}</li>`);
        } else if (orderedMatch) {
          if (listMode !== "ol") {
            if (listMode === "ul") parts.push("</ul>");
            parts.push('<ol class="my-1.5 list-decimal pl-5 space-y-1">');
            listMode = "ol";
          }
          parts.push(`<li>${renderInlineMarkdown(orderedMatch[1])}</li>`);
        } else {
          if (listMode) {
            parts.push(listMode === "ul" ? "</ul>" : "</ol>");
            listMode = null;
          }
          if (!line) {
            continue;
          } else if (line.startsWith("### ")) {
            parts.push(`<h4 class="mt-2 font-semibold text-slate-800 dark:text-slate-100">${renderInlineMarkdown(line.slice(4))}</h4>`);
          } else if (line.startsWith("## ")) {
            parts.push(`<h3 class="mt-2 font-bold text-slate-900 dark:text-white">${renderInlineMarkdown(line.slice(3))}</h3>`);
          } else if (line.startsWith("# ")) {
            parts.push(`<h3 class="mt-2 font-bold text-slate-900 dark:text-white">${renderInlineMarkdown(line.slice(2))}</h3>`);
          } else {
            parts.push(`<p class="my-1">${renderInlineMarkdown(line)}</p>`);
          }
        }
      }
      if (listMode) parts.push(listMode === "ul" ? "</ul>" : "</ol>");
      return parts.join("");
    }

    function NotesMarkdownView({ content, className = "" }) {
      const html = useMemo(() => renderNotesMarkdownHtml(content), [content]);
      if (!html) return null;
      return (
        <div
          className={`text-xs leading-relaxed text-slate-600 dark:text-slate-300 [&_h1]:mt-2 [&_h1]:text-sm [&_h1]:font-bold [&_h1]:text-slate-900 dark:[&_h1]:text-white [&_h2]:mt-2 [&_h2]:text-xs [&_h2]:font-bold [&_h2]:text-slate-900 dark:[&_h2]:text-white [&_h3]:mt-1.5 [&_h3]:text-xs [&_h3]:font-semibold [&_h3]:text-slate-800 dark:[&_h3]:text-slate-100 [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:my-1.5 [&_ul]:space-y-1 [&_ol]:list-decimal [&_ol]:pl-5 [&_ol]:my-1.5 [&_ol]:space-y-1 [&_p]:my-1 [&_img]:my-2 [&_img]:max-h-56 [&_img]:max-w-full [&_img]:rounded-xl [&_img]:border [&_img]:border-slate-200 dark:[&_img]:border-slate-700 [&_a]:underline [&_a]:text-indigo-600 dark:[&_a]:text-indigo-400 ${className}`}
          dangerouslySetInnerHTML={{ __html: html }}

    function TaskNotesIndicator({ task, accent }) {

            onClick={() => setExpanded((prev) => !prev)}
            className={`inline-flex items-center gap-1.5 rounded-md px-2 py-0.5 text-[11px] font-medium transition ${accent.softBtn}`}
            title="Klik om de Markdown-notitie te tonen of te verbergen"
          >
            <span>📝 Notities</span>
            <span>{expanded ? "▲" : "▼"}</span>
          </button>

          {expanded && (
            <div className="mt-2 rounded-xl border border-slate-200/80 bg-slate-50/90 p-3 dark:border-slate-800 dark:bg-slate-950/70">
              <NotesMarkdownView content={task.notes} />
            </div>
          )}
        </div>
      );
    }

    function normalizeTaskShape(t) {
      const validProjectIds = PROJECTS.map((p) => p.id);
      return {
        ...t,
        project: validProjectIds.includes(t.project) ? t.project : "werk",
        daily: Boolean(t.daily),
        dailyNote: typeof t.dailyNote === "string" ? t.dailyNote : "",
        notes: typeof t.notes === "string" ? t.notes : "",
        recurrence: t.recurrence || {
          type: "none",
          interval: 1,
          unit: "days",
          mode: "from_completion"
        },
        completions: Array.isArray(t.completions) ? t.completions : []
      };

        status: "todo",
        targetDate: null,
        notes: "Staat in de backlog tot er tijd vrij is.",
        daily: false,
        dailyNote: "",
        recurrence: { type: "none", interval: 1, unit: "days", mode: "from_completion" },
        completions: [],
        createdAt: new Date().toISOString()
      }
    ];

    function App() {
      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed.map(normalizeTaskShape);
          }
        } catch (e) {}
        return INITIAL_TASKS.map(normalizeTaskShape);
      });

      const [undoStack, setUndoStack] = useState([]);

      const [darkMode, setDarkMode] = useState(() => {
        try {
          const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
          if (savedTheme !== null) return savedTheme === "true";
        } catch (e) {}
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      });

      const [viewMode, setViewMode] = useState(() => (window.innerWidth < 768 ? "day" : "split"));
      const [activeProject, setActiveProject] = useState("werk"); // "werk" | "verburch" | "persoonlijk" | "all"
      const [dayLayout, setDayLayout] = useState("focus");
      const [selectedDate, setSelectedDate] = useState(() => toDateStr());
      const [showDoneInDay, setShowDoneInDay] = useState(true);
      const [backlogFilter, setBacklogFilter] = useState("all");
      const [dailyFilter, setDailyFilter] = useState("all"); // "all" | "done" | "todo"
      const [searchQuery, setSearchQuery] = useState("");
      const [menuOpen, setMenuOpen] = useState(false);

      // Nieuwe taak invoer
      const [newTitle, setNewTitle] = useState("");
      const [newProject, setNewProject] = useState("werk");
      const [newDate, setNewDate] = useState(() => toDateStr());
      const [newNotes, setNewNotes] = useState("");
      const [newDaily, setNewDaily] = useState(false);
      const [newDailyNote, setNewDailyNote] = useState("");
      const [newRecType, setNewRecType] = useState("none");
      const [newRecInterval, setNewRecInterval] = useState(1);
      const [newRecUnit, setNewRecUnit] = useState("days");
      const [newRecMode, setNewRecMode] = useState("from_completion");
      const [showNewOptions, setShowNewOptions] = useState(false);

      // Bewerken van taak
      const [editingTask, setEditingTask] = useState(null);
      const editFormRef = useRef(null);
      const editNotesTextareaRef = useRef(null);
      const [expandedHistoryIds, setExpandedHistoryIds] = useState({});
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [dragOverTarget, setDragOverTarget] = useState(null);
      const [toast, setToast] = useState(null);

      // Firebase auth & sync state
      const [fbReady, setFbReady] = useState(Boolean(window.FocusFlowFirebase));
      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("Lokaal");
      const [syncError, setSyncError] = useState("");
      const skipNextCloudWriteRef = useRef(false);
      const fileInputRef = useRef(null);
      const menuRef = useRef(null);

      const todayStr = toDateStr();
      const accent = useMemo(() => getActiveAccentTheme(activeProject), [activeProject]);

      useEffect(() => {
        if (activeProject !== "all") {
          setNewProject(activeProject);
        }
      }, [activeProject]);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", darkMode);
        try {
          localStorage.setItem(THEME_STORAGE_KEY, String(darkMode));
        } catch (e) {}
      }, [darkMode]);

      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {}
      }, [tasks]);

      useEffect(() => {
        if (!menuOpen) return;
        function onDocClick(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) {
            setMenuOpen(false);
          }
        }
        function onKeyDown(e) {
          if (e.key === "Escape") setMenuOpen(false);
        }
        document.addEventListener("mousedown", onDocClick);
        document.addEventListener("keydown", onKeyDown);
        return () => {
          document.removeEventListener("mousedown", onDocClick);
          document.removeEventListener("keydown", onKeyDown);
        };
      }, [menuOpen]);

      useEffect(() => {
        if (!editingTask) return;
        function onEditKeyDown(e) {
          if (e.key === "Escape") {
            setEditingTask(null);
          } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
            e.preventDefault();
            editFormRef.current?.requestSubmit();
          }
        }
        document.addEventListener("keydown", onEditKeyDown);
        return () => document.removeEventListener("keydown", onEditKeyDown);
      }, [editingTask]);

      useEffect(() => {
        if (window.FocusFlowFirebase) {
          setFbReady(true);
          return;
        }
        const onReady = () => setFbReady(true);
        window.addEventListener("focusflow-firebase-ready", onReady);
        return () => window.removeEventListener("focusflow-firebase-ready", onReady);
      }, []);

      useEffect(() => {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, onAuthStateChanged, signInAnonymously } = window.FocusFlowFirebase;

        const unsub = onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            setSyncError("");
          } else {
            setUser(null);
            try {
              setSyncStatus("Verbinden...");
              await signInAnonymously(auth);
            } catch (err) {
              setSyncStatus("Alleen lokaal");
            }
          }
        });

        return () => unsub();
      }, [fbReady]);

      useEffect(() => {
        if (!fbReady || !window.FocusFlowFirebase || !user) return;
        const { db, doc, onSnapshot } = window.FocusFlowFirebase;

        setSyncStatus("Synchroniseren...");
        const userDocRef = doc(db, "focusflow_users", user.uid);

        const unsub = onSnapshot(
          userDocRef,
          (snap) => {
            setSyncError("");
            if (snap.exists()) {
              const data = snap.data();
              if (Array.isArray(data.tasks)) {
                skipNextCloudWriteRef.current = true;
                setTasks(data.tasks.map(normalizeTaskShape));
              }
              setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
            } else {
              setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
            }
          },
          (err) => {
            console.error("Firestore fout:", err);
            setSyncStatus("Fout bij sync");
            setSyncError(err.message || "Geen toegang tot Firestore. Controleer je Firestore Rules.");
          }
        );

        return () => unsub();
      }, [fbReady, user]);

      async function saveTasksToCloud(nextTasks) {
        if (!fbReady || !window.FocusFlowFirebase || !user) return;
        const { db, doc, setDoc } = window.FocusFlowFirebase;
        try {
          setSyncStatus("Opslaan...");
          const userDocRef = doc(db, "focusflow_users", user.uid);
          await setDoc(
            userDocRef,
            {
              tasks: nextTasks,
              updatedAt: new Date().toISOString(),
              ownerEmail: user.email || null
            },
            { merge: true }
          );
          setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
          setSyncError("");
        } catch (err) {
          console.error("Opslaan mislukt:", err);
          setSyncStatus("Fout bij opslaan");
          setSyncError(err.message || "Kon niet opslaan in Firestore.");
        }
      }

      function commitTasksChange(updater, actionLabel = "Wijziging") {
        setTasks((prev) => {
          const snapshot = JSON.parse(JSON.stringify(prev));
          const next = typeof updater === "function" ? updater(prev) : updater;
          setUndoStack((stack) => [...stack.slice(-19), { tasks: snapshot, label: actionLabel }]);
          if (skipNextCloudWriteRef.current) {
            skipNextCloudWriteRef.current = false;
          } else {
            saveTasksToCloud(next);
          }
          return next;
        });
      }

      function applyDirectTasksState(nextTasks) {
        setTasks(nextTasks);
        saveTasksToCloud(nextTasks);
      }

      function handleUndo() {
        setUndoStack((stack) => {
          if (stack.length === 0) return stack;
          const lastEntry = stack[stack.length - 1];
          applyDirectTasksState(lastEntry.tasks);
          setToast({
            message: `Ongedaan gemaakt: ${lastEntry.label}`,
            canUndo: false
          });
          return stack.slice(0, -1);
        });
      }

      function showToast(message, canUndo = false) {
        setToast({ message, canUndo });
      }

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 5000);
        return () => clearTimeout(timer);
      }, [toast]);

      async function handleGoogleLogin() {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, googleProvider, signInWithPopup } = window.FocusFlowFirebase;
        try {
          setSyncError("");
          await signInWithPopup(auth, googleProvider);
          showToast("Ingelogd met Google");
        } catch (err) {
          setSyncError(err.message || "Inloggen met Google is geannuleerd of mislukt.");
        }
      }

      async function handleGoogleLogout() {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, signOut } = window.FocusFlowFirebase;
        try {
          setMenuOpen(false);
          await signOut(auth);
          showToast("Uitgelogd bij Google");
        } catch (err) {
          setSyncError(err.message || "Uitloggen mislukt.");
        }
      }

      function handleAddTask(e) {
        e.preventDefault();
        const trimmed = newTitle.trim();
        if (!trimmed) return;

        const recurrence = {
          type: newRecType,
          interval: Math.max(1, Number(newRecInterval) || 1),
          unit: newRecUnit,
          mode: newRecMode
        };

        const created = normalizeTaskShape({
          id: `t-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          title: trimmed,
          project: activeProject !== "all" ? activeProject : newProject,
          status: "todo",
          targetDate: newDate || null,
          notes: newNotes.trim(),
          daily: Boolean(newDaily),
          dailyNote: newDailyNote.trim(),
          recurrence,
          completions: [],
          createdAt: new Date().toISOString()
        });

        commitTasksChange((prev) => [created, ...prev], `Taak "${trimmed}" toevoegen`);
        setNewTitle("");
        setNewNotes("");
        setNewDaily(false);
        setNewDailyNote("");
        showToast(
          created.targetDate
            ? `Taak gepland op ${formatDutchDate(created.targetDate, todayStr)}`
            : "Taak toegevoegd aan backlog",
          true
        );
      }

      // Afronden/heropenen van taak: niet-terugkerende afgeronde taken krijgen automatisch daily: true
      function handleToggleComplete(taskId) {
        const target = tasks.find((t) => t.id === taskId);
        if (!target) return;

        const nowIso = new Date().toISOString();
        const completedOnStr = target.targetDate || todayStr;
        const hasRecurrence = isRecurringTask(target);

        commitTasksChange(
          (prev) =>
            prev.map((t) => {
              if (t.id !== taskId) return t;

              if (t.status === "done") {
                const nextCompletions = Array.isArray(t.completions) ? t.completions.slice(0, -1) : [];
                return {
                  ...t,
                  status: "todo",
                  targetDate: t.targetDate || todayStr,
                  completions: nextCompletions
                };
              }

              const prevCompletions = Array.isArray(t.completions) ? t.completions : [];
              const nextCompletions = [
                ...prevCompletions,
                {
                  completedAt: nowIso,
                  scheduledDate: t.targetDate || todayStr
                }
              ];

              if (hasRecurrence) {
                const nextDue = computeNextDueDate(t, completedOnStr);
                return {
                  ...t,
                  status: "todo",
                  targetDate: nextDue,
                  lastCompletedAt: nowIso,
                  completions: nextCompletions
                };
              }

              return {
                ...t,
                status: "done",
                targetDate: t.targetDate || todayStr,
                completedAt: nowIso,
                daily: true,
                completions: nextCompletions
              };
            }),
          `Status van "${target.title}"`
        );

        if (target.status === "todo" && hasRecurrence) {
          const nextDue = computeNextDueDate(target, completedOnStr);
          showToast(
            `"${target.title}" afgerond • Volgende datum: ${formatDutchDate(nextDue, todayStr)}`,
            true
          );
        } else if (target.status === "todo") {
          showToast(`"${target.title}" afgerond en toegevoegd aan Daily`, true);
        } else {
          showToast(`"${target.title}" weer op To do gezet`, true);
        }
      }

      function handleToggleDaily(taskId) {
        const target = tasks.find((t) => t.id === taskId);
        if (!target) return;
        const nextDaily = !Boolean(target.daily);
        commitTasksChange(
          (prev) => prev.map((t) => (t.id === taskId ? { ...t, daily: nextDaily } : t)),
          nextDaily ? `"${target.title}" in Daily` : `"${target.title}" uit Daily`
        );
        showToast(
          nextDaily ? `"${target.title}" gemarkeerd voor Daily` : `"${target.title}" uit Daily gehaald`,
          true
        );
      }

      function handleUpdateDailyNote(taskId, noteValue) {
        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              t.id === taskId ? { ...t, dailyNote: noteValue } : t
            ),
          "Daily-notitie bijwerken"
        );
      }

      function handleClearAllDailyFlags() {
        const dailyIds = new Set(allDailyTasks.map((t) => t.id));
        if (dailyIds.size === 0) return;
        commitTasksChange(
          (prev) => prev.map((t) => (dailyIds.has(t.id) ? { ...t, daily: false } : t)),
          "Alle Daily-vinkjes wissen"
        );
        showToast("Alle Daily-vinkjes gewist", true);
      }

      function handleCopyDailySummary() {
        if (visibleDailyTasks.length === 0) return;
        const lines = visibleDailyTasks.map((t) => {
          const statusPrefix = t.status === "done" ? "[✓]" : "[ ]";
          const projLabel = getProjectMeta(t.project).label;
          const notePart = t.dailyNote ? ` — ${t.dailyNote}` : "";
          return `${statusPrefix} (${projLabel}) ${t.title}${notePart}`;
        });
        const summaryText = `Daily update (${todayStr}):\n${lines.join("\n")}`;

        const tempArea = document.createElement("textarea");
        tempArea.value = summaryText;
        document.body.appendChild(tempArea);
        tempArea.select();
        try {
          document.execCommand("copy");
          showToast("Daily-update gekopieerd naar klembord");
        } catch (err) {
          setSyncError("Kopiëren naar klembord is niet gelukt.");
        }
        document.body.removeChild(tempArea);
      }

      function handleMoveAllOverdueToToday() {
        if (overdueTasks.length === 0) return;
        const overdueIds = new Set(overdueTasks.map((t) => t.id));
        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              overdueIds.has(t.id)
                ? { ...t, status: "todo", targetDate: todayStr }
                : t
            ),
          `Alle verlopen taken (${overdueTasks.length}) naar vandaag`
        );
        showToast(`${overdueTasks.length} verlopen taak/taken verplaatst naar Vandaag`, true);
      }

      function handleMoveRemainingDayTasksToTomorrow(sourceDateStr) {
        const remainingForDate = filteredTasks.filter(
          (t) => t.status === "todo" && t.targetDate === sourceDateStr
        );
        if (remainingForDate.length === 0) return;
        const targetIds = new Set(remainingForDate.map((t) => t.id));
        const tomorrowStr = addDaysStr(sourceDateStr, 1);

        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              targetIds.has(t.id)
                ? { ...t, status: "todo", targetDate: tomorrowStr }
                : t
            ),
          `Resterende taken (${remainingForDate.length}) naar ${formatDutchDate(tomorrowStr, todayStr)}`
        );
        showToast(
          `${remainingForDate.length} resterende taak/taken verplaatst naar ${formatDutchDate(tomorrowStr, todayStr)}`,
          true
        );
      }

      function handleSetTargetDate(taskId, nextDate) {
        const target = tasks.find((t) => t.id === taskId);
        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              t.id === taskId
                ? {
                    ...t,
                    status: "todo",
                    targetDate: nextDate || null
                  }
                : t
            ),
          `Datum van "${target?.title || "taak"}"`
        );
        if (nextDate) {
          showToast(`Gepland op ${formatDutchDate(nextDate, todayStr)}`, true);
        } else {
          showToast("Verplaatst naar de backlog", true);
        }
      }

      function handleDeleteTask(taskId) {
        const deleted = tasks.find((t) => t.id === taskId);
        commitTasksChange(
          (prev) => prev.filter((t) => t.id !== taskId),
          `"${deleted?.title || "Taak"}" verwijderen`
        );
        if (editingTask?.id === taskId) setEditingTask(null);
        showToast(`"${deleted?.title || "Taak"}" verwijderd`, true);
      }

      function handleSaveEdit(e) {
        e.preventDefault();
        if (!editingTask || !editingTask.title.trim()) return;

        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              t.id === editingTask.id
                ? {
                    ...t,
                    title: editingTask.title.trim(),
                    targetDate: editingTask.targetDate || null,
                    notes: editingTask.notes || "",
                    daily: Boolean(editingTask.daily),
                    dailyNote: (editingTask.dailyNote || "").trim(),
                    status: editingTask.status || "todo",
                    recurrence: editingTask.recurrence || {
                      type: "none",
                      interval: 1,
                      unit: "days",
                      mode: "from_completion"
                    }
                  }
                : t
            ),
          `Bewerken van "${editingTask.title.trim()}"`
        );
        setEditingTask(null);
        showToast("Taak bijgewerkt", true);
      }

      function toggleHistoryExpand(taskId) {
        setExpandedHistoryIds((prev) => ({ ...prev, [taskId]: !prev[taskId] }));
      }

      // Vervang `- ` op een nieuwe regel direct door een net bullet-teken (`• `) en zet `1. ` bij Enter door
      function handleNotesChange(e) {
        const nextVal = e.target.value;
        const ta = editNotesTextareaRef.current;
        const cursorPos = ta ? ta.selectionStart : nextVal.length;

        const beforeCursor = nextVal.slice(0, cursorPos);
        const afterCursor = nextVal.slice(cursorPos);
        const lineStartIdx = beforeCursor.lastIndexOf("\n") + 1;
        const currentLine = beforeCursor.slice(lineStartIdx);

        // Als de gebruiker op de huidige regel "- " typt, zet dit automatisch om naar "• "
        if (currentLine === "- ") {
          const updatedBefore = `${beforeCursor.slice(0, lineStartIdx)}• `;
          const updatedVal = `${updatedBefore}${afterCursor}`;
          setEditingTask((prev) => (prev ? { ...prev, notes: updatedVal } : prev));
          requestAnimationFrame(() => {
            if (editNotesTextareaRef.current) {
              const pos = updatedBefore.length;
              editNotesTextareaRef.current.focus();
              editNotesTextareaRef.current.setSelectionRange(pos, pos);
            }
          });
          return;
        }

        setEditingTask((prev) => (prev ? { ...prev, notes: nextVal } : prev));
      }

      // Laat Enter op een "• "-regel of genummerde regel ("1. ") automatisch de lijstregel voortzetten
      function handleNotesKeyDown(e) {
        if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.metaKey) return;
        const ta = editNotesTextareaRef.current;
        if (!ta) return;

        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const currentNotes = editingTask?.notes || "";
        const before = currentNotes.slice(0, start);
        const after = currentNotes.slice(end);
        const lineStartIdx = before.lastIndexOf("\n") + 1;
        const currentLine = before.slice(lineStartIdx);

        // Lege bullet-regel beëindigt de lijst
        if (currentLine === "• ") {
          e.preventDefault();
          const cleanedBefore = `${before.slice(0, lineStartIdx)}\n`;
          const nextNotes = `${cleanedBefore}${after}`;
          setEditingTask((prev) => (prev ? { ...prev, notes: nextNotes } : prev));
          requestAnimationFrame(() => {
            if (editNotesTextareaRef.current) {
              editNotesTextareaRef.current.focus();
              editNotesTextareaRef.current.setSelectionRange(cleanedBefore.length, cleanedBefore.length);
            }
          });
          return;
        }

        if (currentLine.startsWith("• ")) {
          e.preventDefault();
          const insertion = "\n• ";
          const nextNotes = `${before}${insertion}${after}`;
          setEditingTask((prev) => (prev ? { ...prev, notes: nextNotes } : prev));
          requestAnimationFrame(() => {
            if (editNotesTextareaRef.current) {
              const pos = start + insertion.length;
              editNotesTextareaRef.current.focus();
              editNotesTextareaRef.current.setSelectionRange(pos, pos);
            }
          });
          return;
        }

        const orderedMatch = currentLine.match(/^(\d+)\.\s+(.*)$/);
        if (orderedMatch) {
          e.preventDefault();
          // Als de genummerde regel leeg is, stop nummering
          if (!orderedMatch[2].trim()) {
            const cleanedBefore = `${before.slice(0, lineStartIdx)}\n`;
            const nextNotes = `${cleanedBefore}${after}`;
            setEditingTask((prev) => (prev ? { ...prev, notes: nextNotes } : prev));
            requestAnimationFrame(() => {
              if (editNotesTextareaRef.current) {
                editNotesTextareaRef.current.focus();
                editNotesTextareaRef.current.setSelectionRange(cleanedBefore.length, cleanedBefore.length);
              }
            });
            return;
          }

          const nextNum = Number(orderedMatch[1]) + 1;
          const insertion = `\n${nextNum}. `;
          const nextNotes = `${before}${insertion}${after}`;
          setEditingTask((prev) => (prev ? { ...prev, notes: nextNotes } : prev));
          requestAnimationFrame(() => {
            if (editNotesTextareaRef.current) {
              const pos = start + insertion.length;
              editNotesTextareaRef.current.focus();
              editNotesTextareaRef.current.setSelectionRange(pos, pos);
            }
          });
        }
      }

      // Ondersteun direct plakken van een plaatje of afbeeldingslink uit klembord in het notitieveld
      function handleNotesPaste(e) {
        const clipboardData = e.clipboardData;
        if (!clipboardData) return;

        const items = Array.from(clipboardData.items || []);
        const imageItem = items.find((item) => item.type && item.type.startsWith("image/"));
        if (imageItem) {
          const file = imageItem.getAsFile();
          if (file) {
            e.preventDefault();
            const reader = new FileReader();
            reader.onload = (ev) => {
              const dataUrl = ev.target?.result;
              if (typeof dataUrl === "string" && dataUrl.startsWith("data:image/")) {
                const ta = editNotesTextareaRef.current;
                const snippet = `![Geplakte afbeelding](${dataUrl})`;
                setEditingTask((prev) => {
                  if (!prev) return prev;
                  const currentNotes = prev.notes || "";
                  if (!ta || typeof ta.selectionStart !== "number") {
                    const separator = currentNotes.trim() ? "\n" : "";
                    return { ...prev, notes: `${currentNotes}${separator}${snippet}` };
                  }
                  const start = ta.selectionStart;
                  const end = ta.selectionEnd;
                  const before = currentNotes.slice(0, start);
                  const after = currentNotes.slice(end);
                  const needsLeadingNewline = before.length > 0 && !before.endsWith("\n");
                  const needsTrailingNewline = after.length > 0 && !after.startsWith("\n");
                  const inserted = `${needsLeadingNewline ? "\n" : ""}${snippet}${needsTrailingNewline ? "\n" : ""}`;
                  const nextNotes = `${before}${inserted}${after}`;
                  requestAnimationFrame(() => {
                    if (editNotesTextareaRef.current) {
                      const pos = before.length + inserted.length;
                      editNotesTextareaRef.current.focus();
                      editNotesTextareaRef.current.setSelectionRange(pos, pos);
                    }
                  });
                  return { ...prev, notes: nextNotes };
                });
              }
            };
            reader.readAsDataURL(file);
          }
          return;
        }

        const pastedText = (clipboardData.getData("text/plain") || "").trim();
        const isDirectImageUrl =
          /^https?:\/\/\S+\.(png|jpe?g|gif|webp|avif|svg)(\?\S*)?$/i.test(pastedText);
        if (isDirectImageUrl) {
          e.preventDefault();
          const ta = editNotesTextareaRef.current;
          const snippet = `![Afbeelding](${pastedText})`;
          setEditingTask((prev) => {
            if (!prev) return prev;
            const currentNotes = prev.notes || "";
            if (!ta || typeof ta.selectionStart !== "number") {
              const separator = currentNotes.trim() ? "\n" : "";
              return { ...prev, notes: `${currentNotes}${separator}${snippet}` };
            }
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const before = currentNotes.slice(0, start);
            const after = currentNotes.slice(end);
            const needsLeadingNewline = before.length > 0 && !before.endsWith("\n");
            const needsTrailingNewline = after.length > 0 && !after.startsWith("\n");
            const inserted = `${needsLeadingNewline ? "\n" : ""}${snippet}${needsTrailingNewline ? "\n" : ""}`;
            const nextNotes = `${before}${inserted}${after}`;
            requestAnimationFrame(() => {
              if (editNotesTextareaRef.current) {
                const pos = before.length + inserted.length;
                editNotesTextareaRef.current.focus();
                editNotesTextareaRef.current.setSelectionRange(pos, pos);
              }
            });
            return { ...prev, notes: nextNotes };
          });
        }
      }

      function handleExportJson() {
        setMenuOpen(false);
        const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `focusflow-backup-${todayStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Backup (JSON) gedownload");
      }

      function handleImportJson(e) {
        setMenuOpen(false);
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!Array.isArray(parsed)) throw new Error("Ongeldig formaat");
            commitTasksChange(parsed.map(normalizeTaskShape), "JSON-import");
            showToast(`${parsed.length} taken geïmporteerd`, true);
          } catch {
            setSyncError("Kon het JSON-bestand niet inlezen.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

      const weekDays = useMemo(() => {
        const base = parseDateStr(selectedDate) || new Date();
        const list = [];
        for (let i = -1; i <= 5; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          list.push(toDateStr(d));
        }
        return list;
      }, [selectedDate]);

      const filteredTasks = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return tasks.filter((t) => {
          const matchesProject = activeProject === "all" || (t.project || "werk") === activeProject;
          if (!matchesProject) return false;
          if (!q) return true;
          return (
            t.title.toLowerCase().includes(q) ||
            (t.notes && t.notes.toLowerCase().includes(q)) ||
            (t.dailyNote && t.dailyNote.toLowerCase().includes(q))
          );
        });
      }, [tasks, searchQuery, activeProject]);

      const allDailyTasks = useMemo(() => {
        return filteredTasks.filter((t) => Boolean(t.daily));
      }, [filteredTasks]);

      const dailyDoneTasks = useMemo(() => {
        return allDailyTasks.filter((t) => t.status === "done");
      }, [allDailyTasks]);

      const dailyOpenTasks = useMemo(() => {
        return allDailyTasks.filter((t) => t.status !== "done");
      }, [allDailyTasks]);

      const visibleDailyTasks = useMemo(() => {
        if (dailyFilter === "done") return dailyDoneTasks;
        if (dailyFilter === "todo") return dailyOpenTasks;
        return allDailyTasks;
      }, [allDailyTasks, dailyDoneTasks, dailyOpenTasks, dailyFilter]);

      // Taken gepland voor vandaag (binnen actieve projectfilter / zoekopdracht)
      const todayPlannedTasks = useMemo(() => {
        return filteredTasks.filter((t) => t.targetDate === todayStr);
      }, [filteredTasks, todayStr]);

      const overdueTasks = useMemo(() => {
        return filteredTasks.filter(
          (t) => t.status === "todo" && t.targetDate && t.targetDate < todayStr
        );
      }, [filteredTasks, todayStr]);

      const selectedDateTodoTasks = useMemo(() => {
        return filteredTasks.filter(
          (t) => t.status === "todo" && t.targetDate === selectedDate
        );
      }, [filteredTasks, selectedDate]);

      const selectedDateDoneTasks = useMemo(() => {
        return filteredTasks.filter((t) => {
          if (t.status === "done" && (t.targetDate === selectedDate || (!t.targetDate && selectedDate === todayStr))) {
            return true;
          }
          if (Array.isArray(t.completions)) {
            return t.completions.some((c) => {
              const cDate = c.completedAt ? toDateStr(new Date(c.completedAt)) : c.scheduledDate;
              return cDate === selectedDate;
            });
          }
          return false;
        });
      }, [filteredTasks, selectedDate, todayStr]);

      const backlogTasks = useMemo(() => {
        return filteredTasks.filter((t) => t.status === "todo" && !t.targetDate).filter((t) => {
          if (backlogFilter === "recurring") return isRecurringTask(t);
          if (backlogFilter === "notes") return Boolean(t.notes && t.notes.trim());
          return true;
        });
      }, [filteredTasks, backlogFilter]);

      const upcomingDaysList = useMemo(() => {
        return Array.from({ length: 7 }, (_, idx) => addDaysStr(todayStr, idx));
      }, [todayStr]);

      const logbookEntriesByDate = useMemo(() => {
        const entries = [];
        for (const t of filteredTasks) {
          if (Array.isArray(t.completions) && t.completions.length > 0) {
            t.completions.forEach((c, idx) => {
              const dtStr = c.completedAt ? toDateStr(new Date(c.completedAt)) : c.scheduledDate || todayStr;
              entries.push({
                key: `${t.id}-${idx}-${c.completedAt || idx}`,
                taskId: t.id,
                title: t.title,
                completedAt: c.completedAt,
                dateStr: dtStr,
                isRecurring: isRecurringTask(t),
                nextDue: t.targetDate
              });
            });
          } else if (t.status === "done") {
            const dtStr = t.completedAt ? toDateStr(new Date(t.completedAt)) : t.targetDate || todayStr;
            entries.push({
              key: `${t.id}-done`,
              taskId: t.id,
              title: t.title,
              completedAt: t.completedAt,
              dateStr: dtStr,
              isRecurring: false,
              nextDue: null
            });
          }
        }

        entries.sort((a, b) => {
          if (a.completedAt && b.completedAt) {
            return new Date(b.completedAt) - new Date(a.completedAt);
          }
          return b.dateStr.localeCompare(a.dateStr);
        });

        const grouped = new Map();
        for (const item of entries) {
          if (!grouped.has(item.dateStr)) grouped.set(item.dateStr, []);
          grouped.get(item.dateStr).push(item);
        }
        return Array.from(grouped.entries());
      }, [filteredTasks, todayStr]);

      const accountLabel =
        user && !user.isAnonymous
          ? user.displayName || user.email || "Google-account"
          : "Niet ingelogd met Google";

      function renderTaskCard(task, options = {}) {

                </div>

                {isHistoryOpen && completionsCount > 0 && (

                      Voltooiingshistorie:
                    </div>
                    <ul className="space-y-1 text-slate-500 dark:text-slate-400">
                      {[...task.completions].reverse().map((c, idx) => (
                        <li key={idx} className="flex items-center justify-between gap-2">

                {showScheduleActions && (
                  <div className="mt-2.5 flex flex-wrap items-center gap-1.5 pt-1 border-t border-slate-100 dark:border-slate-800/80">
                    <button
                      type="button"
                      onClick={() => handleSetTargetDate(task.id, todayStr)}
                      className={`rounded-lg px-2.5 py-1 text-xs font-medium transition ${cardAccent.softBtn}`}
                    >

                    <button
                      type="button"
                      onClick={() => handleSetTargetDate(task.id, addDaysStr(todayStr, 1))}
                      className="rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"

                    </button>
                    <label className="inline-flex items-center gap-1 rounded-lg bg-slate-100 px-2 py-1 text-xs text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                      <span>Datum:</span>
                      <input
                        type="date"
                        value={task.targetDate || ""}
                        onChange={(e) => handleSetTargetDate(task.id, e.target.value || null)}
                        className="bg-transparent text-xs outline-none"
                      />
                    </label>
                    {task.targetDate && (
                      <button

                        onClick={() => handleSetTargetDate(task.id, null)}

                      >
                        Naar backlog
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-24">
          <header className="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
            <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
              <div className="flex items-center gap-3">
                <div className={`flex h-9 w-9 items-center justify-center rounded-xl font-bold shadow-sm ${accent.primaryBtn}`}>
                  FF
                </div>
                <div>
                  <h1 className="text-base font-bold leading-tight">FocusFlow</h1>
                  <div className="text-xs text-slate-500 dark:text-slate-400">
                    <span>{syncStatus}</span>

                </div>
              </div>

                          {count}

                  <button
                    type="button"

                    className={`inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 transition ${

                  >

                    { id: "backlog", label: `Backlog (${backlogTasks.length})` },

                  ].map((tab) => (
                    <button

                      className={`rounded-lg px-3 py-1.5 transition ${

              <div className="flex items-center gap-2">
                <button

                  className={`rounded-lg border px-3 py-1.5 text-xs font-medium transition ${

                  >

                  <div className="mt-5 space-y-6">
                    {logbookEntriesByDate.map(([dtStr, items]) => (
                      <div key={dtStr}>
                        <h3 className="mb-2.5 text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                          {formatFullDutchDate(dtStr)} ({dtStr})
                        </h3>
                        <div className="space-y-2">
                          {items.map((item) => {
                            const matchedTask = tasks.find((tk) => tk.id === item.taskId);
                            const logAccent = getActiveAccentTheme(activeProject, matchedTask?.project);
                            return (
                              <div
                                key={item.key}
                                className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-800 dark:bg-slate-950/60"
                              >
                                <div className="flex items-center gap-2.5">
                                  <span className="inline-flex h-5 w-5 items-center justify-center rounded-full bg-emerald-500/15 text-xs font-bold text-emerald-600 dark:text-emerald-400">
                                    ✓
                                  </span>
                                  <span className="font-medium">{item.title}</span>
                                  {item.isRecurring && (
                                    <span className={`rounded-md px-2 py-0.5 text-[11px] font-medium ${logAccent.logBadge}`}>
                                      Terugkerend
                                    </span>
                                  )}
                                </div>
                                <div className="text-xs text-slate-500 dark:text-slate-400">
                                  {item.completedAt ? `Om ${formatTimeOnlyNL(item.completedAt)}` : ""}
                                  {item.isRecurring && item.nextDue
                                    ? ` • Volgende beurt: ${formatDutchDate(item.nextDue, todayStr)}`
                                    : ""}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

            {/* SPLIT / DAG / BACKLOG WEERGAVEN */}
            {viewMode !== "logbook" && viewMode !== "daily" && viewMode !== "overdue" && (
              <div
                className={`grid gap-6 ${
                  viewMode === "split" ? "lg:grid-cols-12" : "grid-cols-1"
                }`}
              >
                {(viewMode === "split" || viewMode === "day") && (
                  <section
                    className={`rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 ${
                      viewMode === "split" ? "lg:col-span-7" : ""
                    }`}
                  >
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <div>
                        <h2 className="text-lg font-bold">Dagplanning</h2>
                        <p className="text-xs text-slate-500 dark:text-slate-400">
                          {formatFullDutchDate(selectedDate)}
                        </p>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        {dayLayout === "focus" && selectedDateTodoTasks.length > 0 && (
                          <button
                            type="button"
                            onClick={() => handleMoveRemainingDayTasksToTomorrow(selectedDate)}
                            className={`rounded-lg border px-2.5 py-1 text-xs font-medium transition ${accent.undoBtn}`}
                          >
                            Resterende naar morgen ({selectedDateTodoTasks.length})
                          </button>
                        )}
                        <button
                          type="button"
                          onClick={() => setSelectedDate(todayStr)}
                          className="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
                        >
                          Vandaag
                        </button>
                        <div className="flex rounded-lg bg-slate-100 p-0.5 text-xs dark:bg-slate-800">
                          <button
                            type="button"
                            onClick={() => setDayLayout("focus")}
                            className={`rounded-md px-2.5 py-1 ${
                              dayLayout === "focus"
                                ? `bg-white font-semibold shadow-sm dark:bg-slate-900 ${accent.activeTabText}`
                                : "text-slate-600 dark:text-slate-300"
                            }`}
                          >
                            Dagfocus
                          </button>
                          <button
                            type="button"
                            onClick={() => setDayLayout("agenda")}
                            className={`rounded-md px-2.5 py-1 ${
                              dayLayout === "agenda"
                                ? `bg-white font-semibold shadow-sm dark:bg-slate-900 ${accent.activeTabText}`
                                : "text-slate-600 dark:text-slate-300"
                            }`}
                          >
                            Per dag onder elkaar
                          </button>
                        </div>
                      </div>
                    </div>

                    {overdueTasks.length > 0 && (
                      <div className="mt-4 rounded-xl border border-amber-200 bg-amber-50/70 p-3.5 dark:border-amber-900/70 dark:bg-amber-950/30">
                        <div className="mb-2 flex items-center justify-between">
                          <span className="text-xs font-bold uppercase tracking-wide text-amber-800 dark:text-amber-300">
                            Verlopen taken ({overdueTasks.length})
                          </span>
                          <button
                            type="button"
                            onClick={() => {
                              commitTasksChange(
                                (prev) =>
                                  prev.map((t) =>
                                    t.status === "todo" && t.targetDate && t.targetDate < todayStr
                                      ? { ...t, targetDate: todayStr }
                                      : t
                                  ),
                                "Verlopen taken naar vandaag"
                              );
                              showToast("Alle verlopen taken naar vandaag verplaatst", true);
                            }}
                            className="rounded-lg bg-amber-600 px-2.5 py-1 text-xs font-medium text-white hover:bg-amber-700"
                          >
                            Alles naar vandaag
                          </button>
                        </div>
                        <div className="space-y-2">
                          {overdueTasks.map((t) => renderTaskCard(t, { showScheduleActions: true }))}
                        </div>
                      </div>
                    )}

                    {dayLayout === "focus" ? (
                      <>
                        <div className="mt-4 grid grid-cols-7 gap-1.5">
                          {weekDays.map((dStr) => {
                            const isSelected = dStr === selectedDate;
                            const isToday = dStr === todayStr;
                            const count = tasks.filter(
                              (t) =>
                                t.status === "todo" &&
                                t.targetDate === dStr &&
                                (activeProject === "all" || (t.project || "werk") === activeProject)
                            ).length;
                            const dObj = parseDateStr(dStr);
                            const wd = dObj
                              ? dObj.toLocaleDateString("nl-NL", { weekday: "short" })
                              : "";

                            return (
                              <button
                                key={dStr}
                                type="button"
                                onClick={() => setSelectedDate(dStr)}
                                onDragOver={(e) => {
                                  e.preventDefault();
                                  setDragOverTarget(dStr);
                                }}
                                onDragLeave={() => setDragOverTarget(null)}
                                onDrop={(e) => {
                                  e.preventDefault();
                                  setDragOverTarget(null);
                                  if (draggedTaskId) {
                                    handleSetTargetDate(draggedTaskId, dStr);
                                    setDraggedTaskId(null);
                                  }
                                }}
                                className={`flex flex-col items-center rounded-xl border p-2 text-center transition ${
                                  isSelected
                                    ? `${accent.primaryBtn} border-transparent shadow-sm`
                                    : dragOverTarget === dStr
                                    ? accent.dragOverDay
                                    : "border-slate-200 bg-slate-50/70 hover:border-slate-300 dark:border-slate-800 dark:bg-slate-950/50"
                                }`}
                              >
                                <span className="text-[11px] uppercase opacity-80">{wd}</span>
                                <span className="mt-0.5 text-sm font-bold">
                                  {dObj ? dObj.getDate() : dStr}
                                </span>
                                <span
                                  className={`mt-1 rounded-full px-1.5 text-[10px] font-medium ${
                                    isSelected
                                      ? "bg-white/20 text-white"
                                      : count > 0
                                      ? accent.weekCountBadge
                                      : "text-slate-400"
                                  }`}
                                >
                                  {count}
                                </span>
                                {isToday && !isSelected && (
                                  <span className={`mt-0.5 h-1 w-1 rounded-full ${accent.todayDot}`} />
                                )}
                              </button>
                            );
                          })}
                        </div>

                        <div className="mt-5 space-y-2.5">
                          {selectedDateTodoTasks.length === 0 ? (
                            <div className="rounded-xl border border-dashed border-slate-200 p-6 text-center text-sm text-slate-500 dark:border-slate-800">
                              Geen openstaande taken gepland voor {formatDutchDate(selectedDate, todayStr).toLowerCase()}.
                            </div>
                          ) : (
                            selectedDateTodoTasks.map((t) =>
                              renderTaskCard(t, { showScheduleActions: true })
                            )
                          )}
                        </div>

                        <div className="mt-6 border-t border-slate-100 pt-4 dark:border-slate-800">
                          <button
                            type="button"
                            onClick={() => setShowDoneInDay((v) => !v)}
                            className="flex w-full items-center justify-between text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400"
                          >
                            <span>Afgerond op deze dag ({selectedDateDoneTasks.length})</span>
                            <span>{showDoneInDay ? "Verberg ▲" : "Toon ▼"}</span>
                          </button>
                          {showDoneInDay && selectedDateDoneTasks.length > 0 && (
                            <div className="mt-3 space-y-2">
                              {selectedDateDoneTasks.map((t) =>
                                renderTaskCard(t, { isCompletedEntry: true })
                              )}
                            </div>
                          )}
                        </div>
                      </>
                    ) : (
                      <div className="mt-4 space-y-5">
                        {upcomingDaysList.map((dStr) => {
                          const dayItems = filteredTasks.filter(
                            (t) => t.status === "todo" && t.targetDate === dStr
                          );
                          return (
                            <div
                              key={dStr}
                              onDragOver={(e) => {
                                e.preventDefault();
                                setDragOverTarget(dStr);
                              }}
                              onDrop={(e) => {
                                e.preventDefault();
                                setDragOverTarget(null);
                                if (draggedTaskId) {
                                  handleSetTargetDate(draggedTaskId, dStr);
                                  setDraggedTaskId(null);
                                }
                              }}
                              className={`rounded-xl border p-3.5 ${
                                dragOverTarget === dStr
                                  ? accent.dropBorder
                                  : "border-slate-200/80 bg-slate-50/50 dark:border-slate-800 dark:bg-slate-950/40"
                              }`}
                            >
                              <div className="mb-2.5 flex flex-wrap items-center justify-between gap-2">
                                <h3 className="text-sm font-bold">
                                  {formatDutchDate(dStr, todayStr)}{" "}
                                  <span className="font-normal text-xs text-slate-500">
                                    ({dStr})
                                  </span>
                                </h3>
                                <div className="flex items-center gap-2">
                                  {dayItems.length > 0 && (
                                    <button
                                      type="button"
                                      onClick={() => handleMoveRemainingDayTasksToTomorrow(dStr)}
                                      className={`rounded-lg border px-2.5 py-1 text-xs font-medium transition ${accent.undoBtn}`}
                                    >
                                      Resterende naar morgen ({dayItems.length})
                                    </button>
                                  )}
                                  <span className="text-xs text-slate-500">{dayItems.length} taken</span>
                                </div>
                              </div>
                              {dayItems.length === 0 ? (
                                <p className="text-xs text-slate-400">Geen taken gepland.</p>
                              ) : (
                                <div className="space-y-2">
                                  {dayItems.map((t) =>
                                    renderTaskCard(t, { showScheduleActions: true })
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </section>
                )}

                {(viewMode === "split" || viewMode === "backlog") && (
                  <section
                    onDragOver={(e) => {
                      e.preventDefault();
                      setDragOverTarget("backlog");
                    }}
                    onDragLeave={() => setDragOverTarget(null)}
                    onDrop={(e) => {
                      e.preventDefault();
                      setDragOverTarget(null);
                      if (draggedTaskId) {
                        handleSetTargetDate(draggedTaskId, null);
                        setDraggedTaskId(null);
                      }
                    }}
                    className={`rounded-2xl border p-5 shadow-sm transition ${
                      dragOverTarget === "backlog"
                        ? accent.dropBorder
                        : "border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"
                    } ${viewMode === "split" ? "lg:col-span-5" : ""}`}
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <h2 className="text-lg font-bold">Backlog</h2>
                        <p className="text-xs text-slate-500 dark:text-slate-400">
                          Nog niet gepland werk ({backlogTasks.length})
                        </p>
                      </div>

                      <div className="flex rounded-lg bg-slate-100 p-0.5 text-xs dark:bg-slate-800">
                        {[
                          { id: "all", label: "Alles" },
                          { id: "recurring", label: "Terugkerend" },
                          { id: "notes", label: "Met notitie" }
                        ].map((f) => (
                          <button
                            key={f.id}
                            type="button"
                            onClick={() => setBacklogFilter(f.id)}
                            className={`rounded-md px-2.5 py-1 ${
                              backlogFilter === f.id
                                ? `bg-white font-semibold shadow-sm dark:bg-slate-900 ${accent.activeTabText}`
                                : "text-slate-600 dark:text-slate-300"
                            }`}
                          >
                            {f.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="mt-4 space-y-2.5">
                      {backlogTasks.length === 0 ? (
                        <div className="rounded-xl border border-dashed border-slate-200 p-6 text-center text-sm text-slate-500 dark:border-slate-800">
                          Geen taken in de backlog voor dit filter.
                        </div>
                      ) : (
                        backlogTasks.map((t) => renderTaskCard(t, { showScheduleActions: true }))
                      )}
                    </div>
                  </section>
                )}
              </div>
            )}
          </main>

          {/* Bewerk-modal met vaste header & footer en scrollbare inhoud */}
          {editingTask && (
            <div
              onClick={() => setEditingTask(null)}
              className="fixed inset-0 z-40 flex items-center justify-center bg-black/50 p-4 backdrop-blur-xs"
            >
              <form
                ref={editFormRef}
                onSubmit={handleSaveEdit}
                onClick={(e) => e.stopPropagation()}
                className="flex max-h-[90vh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-800 dark:bg-slate-900"
              >
                <div className="shrink-0 flex items-center justify-between border-b border-slate-100 px-6 py-4 dark:border-slate-800">
                  <h3 className="text-base font-bold">Taak bewerken</h3>
                  <button
                    type="button"
                    onClick={() => setEditingTask(null)}
                    aria-label="Sluiten"
                    className="rounded-lg px-2 py-1 text-xs text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto px-6 py-4 space-y-3.5">
                  <div>
                    <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                      Notitie
                    </label>
                    <textarea
                      ref={editNotesTextareaRef}
                      rows="6"
                      value={editingTask.notes || ""}
                      onKeyDown={handleNotesKeyDown}
                      onPaste={handleNotesPaste}
                      onChange={handleNotesChange}
                      placeholder={"Typ je notitie (# kop, ## subkop, - voor bullet, 1. voor nummering en plak plaatjes direct in het veld)..."}
                      className={`max-h-64 min-h-[120px] w-full overflow-y-auto rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none dark:border-slate-700 dark:bg-slate-950 ${accent.focusRing}`}
                    />
                    {editingTask.notes && editingTask.notes.trim() && (
                      <div className="mt-2 rounded-xl border border-slate-200/80 bg-slate-50/70 p-3 dark:border-slate-800 dark:bg-slate-950/50">
                        <div className="mb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                          Markdown-voorbeeld
                        </div>
                        <NotesMarkdownView content={editingTask.notes} />
                      </div>
                    )}
                  </div>

                  <div className="rounded-xl border border-slate-200/80 bg-slate-50/70 p-3 dark:border-slate-800 dark:bg-slate-950/50 space-y-2.5">
                    <label className="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-200">
                      <input
                        type="checkbox"
                        checked={Boolean(editingTask.daily)}
                        onChange={(e) =>
                          setEditingTask({ ...editingTask, daily: e.target.checked })
                        }
                        className="h-4 w-4 rounded border-slate-300 text-indigo-600"
                      />
                      <span>Meenemen in Daily</span>
                    </label>
                    <div>
                      <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Daily-notitie
                      </label>
                      <input
                        type="text"
                        value={editingTask.dailyNote || ""}
                        onChange={(e) =>
                          setEditingTask({ ...editingTask, dailyNote: e.target.value })
                        }
                        placeholder="Toelichting voor je daily..."
                        className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs dark:border-slate-700 dark:bg-slate-900"
                      />
                    </div>
                  </div>
                </div>

                <div className="shrink-0 flex items-center justify-between border-t border-slate-100 bg-slate-50/60 px-6 py-3.5 dark:border-slate-800 dark:bg-slate-900/90">
                  <span className="hidden sm:inline text-[11px] text-slate-400">
                    Esc om te sluiten
                  </span>
                  <div className="ml-auto flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setEditingTask(null)}
                      className="rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700"
                    >
                      Annuleren
                    </button>
                    <button
                      type="submit"
                      className={`rounded-xl px-4 py-2 text-xs font-semibold shadow-sm ${accent.primaryBtn}`}
                    >
                      Opslaan
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* Toast melding */}
          {toast && (
            <div className="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-xl bg-slate-900 px-4 py-2.5 text-xs font-medium text-white shadow-lg dark:bg-slate-100 dark:text-slate-900">
              <span>{toast.message}</span>
              {toast.canUndo && (
                <button
                  type="button"
                  onClick={() => {
                    handleUndo();
                    setToast(null);
                  }}
                  className="underline font-bold"
                >
                  Ongedaan maak
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
