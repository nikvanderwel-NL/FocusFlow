          "border-purple-200 bg-purple-50 text-purple-700 hover:bg-purple-100 dark:border-purple-800 dark:bg-purple-950/60 dark:text-purple-300 dark:hover:bg-purple-900/60",

    function getProjectBadgeClasses(projectId) {
      if (projectId === "werk") {
        return "bg-blue-100 text-blue-800 dark:bg-blue-950/80 dark:text-blue-300";
      }
      if (projectId === "verburch") {

      }
      if (projectId === "persoonlijk") {

      }
      return "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300";
    }

    function getProjectLabel(projectId) {
      return PROJECTS.find((p) => p.id === projectId)?.label || "Werk";
    }

    function toDateStr(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(str) {
      if (!str) return null;
      const [y, m, d] = str.split("-").map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }

    function addDaysStr(dateStr, days) {
      const base = parseDateStr(dateStr) || new Date();
      base.setDate(base.getDate() + days);
      return toDateStr(base);
    }

    function addMonthsStr(dateStr, months) {
      const base = parseDateStr(dateStr) || new Date();
      const targetDay = base.getDate();
      base.setDate(1);
      base.setMonth(base.getMonth() + months);
      const maxDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
      base.setDate(Math.min(targetDay, maxDay));
      return toDateStr(base);
    }

    function computeNextDueDate(task, completedDateStr) {
      const rec = task.recurrence;
      if (!rec || rec.type === "none") return null;

      const mode = rec.mode || "from_completion";
      const anchorStr = mode === "from_due" && task.targetDate ? task.targetDate : completedDateStr;

      if (rec.type === "daily") return addDaysStr(anchorStr, 1);
      if (rec.type === "weekdays") {
        let candidate = addDaysStr(anchorStr, 1);
        while ([0, 6].includes(parseDateStr(candidate).getDay())) {
          candidate = addDaysStr(candidate, 1);
        }
        return candidate;
      }
      if (rec.type === "weekly") return addDaysStr(anchorStr, 7);
      if (rec.type === "biweekly") return addDaysStr(anchorStr, 14);
      if (rec.type === "monthly") return addMonthsStr(anchorStr, 1);
      if (rec.type === "custom") {
        const interval = Math.max(1, Number(rec.interval) || 1);
        const unit = rec.unit || "days";
        if (unit === "days") return addDaysStr(anchorStr, interval);
        if (unit === "weeks") return addDaysStr(anchorStr, interval * 7);
        if (unit === "months") return addMonthsStr(anchorStr, interval);
      }
      return addDaysStr(anchorStr, 7);
    }

    function formatRecurrenceLabel(rec) {
      if (!rec || rec.type === "none") return "";
      const modeSuffix = rec.mode === "from_due" ? " (vaste cadans)" : " (vanaf afronden)";
      if (rec.type === "daily") return "Dagelijks" + modeSuffix;
      if (rec.type === "weekdays") return "Werkdagen (ma–vr)" + modeSuffix;
      if (rec.type === "weekly") return "Wekelijks" + modeSuffix;
      if (rec.type === "biweekly") return "Elke 2 weken" + modeSuffix;
      if (rec.type === "monthly") return "Maandelijks" + modeSuffix;
      if (rec.type === "custom") {
        const n = Math.max(1, Number(rec.interval) || 1);
        const unitMap = {
          days: n === 1 ? "dag" : "dagen",
          weeks: n === 1 ? "week" : "weken",
          months: n === 1 ? "maand" : "maanden"
        };
        return `Elke ${n} ${unitMap[rec.unit || "days"]}` + modeSuffix;
      }
      return "";
    }

    function formatDutchDate(dateStr, todayStr) {
      if (!dateStr) return "Geen datum";
      const tomorrowStr = addDaysStr(todayStr, 1);
      const yesterdayStr = addDaysStr(todayStr, -1);
      if (dateStr === todayStr) return "Vandaag";
      if (dateStr === tomorrowStr) return "Morgen";
      if (dateStr === yesterdayStr) return "Gisteren";

      const d = parseDateStr(dateStr);
      if (!d) return dateStr;
      return d.toLocaleDateString("nl-NL", {
        weekday: "short",
        day: "numeric",
        month: "short"
      });
    }

    function formatFullDutchDate(dateStr) {
      const d = parseDateStr(dateStr);
      if (!d) return dateStr;
      return d.toLocaleDateString("nl-NL", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function formatDateTimeNL(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return isoStr;
      return d.toLocaleString("nl-NL", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatTimeOnlyNL(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("nl-NL", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function isSafeImageSrc(src) {
      if (!src || typeof src !== "string") return false;
      const trimmed = src.trim();
      if (/^data:image\/(png|jpeg|jpg|gif|webp);base64,/i.test(trimmed)) return true;
      try {
        const parsed = new URL(trimmed);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch {
        return false;
      }
    }

    // Converteer Markdown-notities naar veilige HTML voor het direct aanpasbare veld
    function markdownToEditorHtml(mdText = "") {
      if (!mdText) return "";
      const lines = mdText.replace(/\r\n/g, "\n").split("\n");
      const htmlParts = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) {
          htmlParts.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          htmlParts.push("</ol>");
          inOl = false;
        }
      };

      const escapeHtml = (str) =>
        str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      const formatInline = (str) => {
        const imgRegex = /!\[([^\]]*)\]\(([^)\s]+)\)/g;
        let result = "";
        let lastIndex = 0;
        let match;
        while ((match = imgRegex.exec(str)) !== null) {
          const before = escapeHtml(str.slice(lastIndex, match.index));
          result += before;
          const alt = escapeHtml(match[1] || "Afbeelding");
          const url = match[2];
          if (isSafeImageSrc(url)) {
            result += `<img src="${escapeHtml(url)}" alt="${alt}" />`;
          } else {
            result += escapeHtml(match[0]);
          }
          lastIndex = imgRegex.lastIndex;
        }
        result += escapeHtml(str.slice(lastIndex));
        return result;
      };

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        if (!line.trim()) {
          closeLists();
          continue;
        }

        const h3Match = line.match(/^###\s+(.*)$/);
        const h2Match = line.match(/^##\s+(.*)$/);
        const h1Match = line.match(/^#\s+(.*)$/);
        const ulMatch = line.match(/^[-*]\s+(.*)$/);
        const olMatch = line.match(/^\d+\.\s+(.*)$/);

        if (h1Match) {
          closeLists();
          htmlParts.push(`<h1>${formatInline(h1Match[1])}</h1>`);
        } else if (h2Match) {
          closeLists();
          htmlParts.push(`<h2>${formatInline(h2Match[1])}</h2>`);
        } else if (h3Match) {
          closeLists();
          htmlParts.push(`<h3>${formatInline(h3Match[1])}</h3>`);
        } else if (ulMatch) {
          if (!inUl) {
            closeLists();
            htmlParts.push("<ul>");
            inUl = true;
          }
          htmlParts.push(`<li>${formatInline(ulMatch[1])}</li>`);
        } else if (olMatch) {
          if (!inOl) {
            closeLists();
            htmlParts.push("<ol>");
            inOl = true;
          }
          htmlParts.push(`<li>${formatInline(olMatch[1])}</li>`);
        } else {
          closeLists();
          htmlParts.push(`<p>${formatInline(line)}</p>`);
        }
      }

      closeLists();
      return htmlParts.join("");
    }

    // Converteer de inhoud van het aanpasbare veld terug naar compacte Markdown
    function editorElementToMarkdown(el) {
      if (!el) return "";
      const blocks = [];

      const walkNode = (node, listContext = null) => {
        if (node.nodeType === Node.TEXT_NODE) {
          return node.textContent || "";
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return "";

        const tag = node.tagName.toLowerCase();
        if (tag === "img") {
          const src = node.getAttribute("src") || "";
          const alt = (node.getAttribute("alt") || "Afbeelding").replace(/\]/g, "");
          if (isSafeImageSrc(src)) {
            return `![${alt}](${src})`;
          }
          return "";
        }
        if (tag === "br") {
          return "";
        }

        if (tag === "ul") {
          const items = [];
          Array.from(node.children).forEach((child) => {
            if (child.tagName.toLowerCase() === "li") {
              const txt = walkNode(child, "ul").trim();
              if (txt) items.push(`- ${txt}`);
            }
          });
          if (items.length) blocks.push(items.join("\n"));
          return "";
        }

        if (tag === "ol") {
          const items = [];
          let counter = 1;
          Array.from(node.children).forEach((child) => {
            if (child.tagName.toLowerCase() === "li") {
              const txt = walkNode(child, "ol").trim();
              if (txt) {
                items.push(`${counter}. ${txt}`);
                counter += 1;
              }
            }
          });
          if (items.length) blocks.push(items.join("\n"));
          return "";
        }

        if (tag === "h1" || tag === "h2" || tag === "h3") {
          const prefix = tag === "h1" ? "# " : tag === "h2" ? "## " : "### ";
          const inner = Array.from(node.childNodes)
            .map((c) => walkNode(c, listContext))
            .join("")
            .trim();
          if (inner) blocks.push(`${prefix}${inner}`);
          return "";
        }

        if (tag === "p" || tag === "div") {
          const imgs = Array.from(node.querySelectorAll("img"));
          const nonImgText = Array.from(node.childNodes)
            .filter((c) => !(c.nodeType === Node.ELEMENT_NODE && c.tagName.toLowerCase() === "img"))
            .map((c) => walkNode(c, listContext))
            .join("")
            .trim();

          if (nonImgText) {
            const hMatch = nonImgText.match(/^(#{1,3})\s+(.*)$/);
            const ulMatch = nonImgText.match(/^[-*]\s+(.*)$/);
            const olMatch = nonImgText.match(/^(\d+)\.\s+(.*)$/);
            if (hMatch) {
              blocks.push(`${hMatch[1]} ${hMatch[2]}`);
            } else if (ulMatch) {
              blocks.push(`- ${ulMatch[1]}`);
            } else if (olMatch) {
              blocks.push(`${olMatch[1]}. ${olMatch[2]}`);
            } else {
              blocks.push(nonImgText);
            }
          }
          imgs.forEach((imgEl) => {
            const mdImg = walkNode(imgEl, listContext);
            if (mdImg) blocks.push(mdImg);
          });
          return "";
        }

        return Array.from(node.childNodes)
          .map((c) => walkNode(c, listContext))
          .join("");
      };

      Array.from(el.childNodes).forEach((child) => {
        if (child.nodeType === Node.TEXT_NODE) {
          const t = (child.textContent || "").trim();
          if (t) blocks.push(t);
        } else {
          walkNode(child, null);
        }
      });

      return blocks.join("\n").trim();
    }

    function hasMarkdownContent(notes) {
      return Boolean(notes && notes.trim().length > 0);
    }

    // Enkel aanpasbaar veld waarin markdown-koppen, lijsten en geplakte plaatjes direct zichtbaar zijn
    function DirectMarkdownEditor({ value, onChange, onSaveShortcut }) {
      const editorRef = useRef(null);
      const lastValueRef = useRef(null);

      useEffect(() => {
        const el = editorRef.current;
        if (!el) return;
        if (value !== lastValueRef.current) {
          el.innerHTML = markdownToEditorHtml(value || "");
          lastValueRef.current = value || "";
        }
      }, [value]);

      const syncFromDom = () => {
        const el = editorRef.current;
        if (!el) return;
        const nextMd = editorElementToMarkdown(el);
        lastValueRef.current = nextMd;
        onChange(nextMd);
      };

      const applyInlineMarkdownPattern = (el) => {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        if (!range.collapsed) return;

        let block = range.startContainer;
        if (block.nodeType === Node.TEXT_NODE) block = block.parentElement;
        while (block && block !== el && !["P", "DIV", "LI", "H1", "H2", "H3"].includes(block.tagName)) {
          block = block.parentElement;
        }
        if (!block || block === el || block.tagName === "LI") return;

        const textBefore = block.textContent || "";
        const hMatch = textBefore.match(/^(#{1,3})\s$/);
        const ulMatch = textBefore.match(/^[-*]\s$/);
        const olMatch = textBefore.match(/^1\.\s$/);

        if (hMatch) {
          const level = hMatch[1].length;
          const heading = document.createElement(`h${level}`);
          heading.innerHTML = "<br>";
          block.replaceWith(heading);
          const r = document.createRange();
          r.setStart(heading, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          syncFromDom();
        } else if (ulMatch) {
          const ul = document.createElement("ul");
          const li = document.createElement("li");
          li.innerHTML = "<br>";
          ul.appendChild(li);
          block.replaceWith(ul);
          const r = document.createRange();
          r.setStart(li, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          syncFromDom();
        } else if (olMatch) {
          const ol = document.createElement("ol");
          const li = document.createElement("li");
          li.innerHTML = "<br>";
          ol.appendChild(li);
          block.replaceWith(ol);
          const r = document.createRange();
          r.setStart(li, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          syncFromDom();
        }
      };

      const insertImageIntoEditor = (src, alt = "Afbeelding") => {
        if (!isSafeImageSrc(src)) return;
        const el = editorRef.current;
        if (!el) return;
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;

        const spacer = document.createElement("p");
        spacer.innerHTML = "<br>";

        const sel = window.getSelection();
        if (sel && sel.rangeCount && el.contains(sel.getRangeAt(0).commonAncestorContainer)) {
          const range = sel.getRangeAt(0);
          range.deleteContents();
          range.insertNode(img);
          range.setStartAfter(img);
          range.insertNode(spacer);
          range.setStart(spacer, 0);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          el.appendChild(img);
          el.appendChild(spacer);
        }
        syncFromDom();
      };

      const handlePaste = (e) => {
        const items = e.clipboardData?.items ? Array.from(e.clipboardData.items) : [];
        const imageItem = items.find((item) => item.type && item.type.startsWith("image/"));

        if (imageItem) {
          e.preventDefault();
          const file = imageItem.getAsFile();
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            if (typeof ev.target?.result === "string") {
              insertImageIntoEditor(ev.target.result, file.name || "Geplakt plaatje");
            }
          };
          reader.readAsDataURL(file);
          return;
        }

        const pastedText = (e.clipboardData?.getData("text/plain") || "").trim();
        if (/^https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?$/i.test(pastedText)) {
          e.preventDefault();
          insertImageIntoEditor(pastedText, "Afbeelding");
        }
      };

      const handleKeyDown = (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          syncFromDom();
          onSaveShortcut?.();
          return;
        }
        if (e.key === " ") {
          setTimeout(() => applyInlineMarkdownPattern(editorRef.current), 0);
        }
      };

      return (
        <div
          ref={editorRef}
          contentEditable
          suppressContentEditableWarning
          onInput={syncFromDom}
          onPaste={handlePaste}
          onKeyDown={handleKeyDown}
          data-placeholder="Typ notities, gebruik # voor koppen, - of 1. voor lijsten en plak plaatjes direct..."
          className="ff-notes-editor min-h-[150px] max-h-72 overflow-y-auto w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"
        />
      );
    }

    const INITIAL_TASKS = [
      {
        id: "t-1",
        title: "Weekprioriteiten bepalen in FocusFlow",
        project: "werk",
        status: "todo",
        targetDate: toDateStr(),
        notes: "## Belangrijkste punten\n- Kies maximaal 3 kerntaken voor vandaag\n- Controleer openstaande deadlines",
        daily: false,
        dailyNote: "",
        recurrence: { type: "weekly", interval: 1, unit: "weeks", mode: "from_completion" },
        completions: [],
        createdAt: new Date().toISOString()
      },
      {
        id: "t-2",
        title: "Bezoekverslag Verburch verwerken",
        project: "verburch",
        status: "todo",
        targetDate: toDateStr(),
        notes: "- Actiepunten uitzetten\n- Koppelen aan lopende afspraken",
        daily: true,
        dailyNote: "Kort toelichten in de daily.",
        recurrence: { type: "weekdays", interval: 1, unit: "days", mode: "from_completion" },
        completions: [],

      },
      {
        id: "t-3",
        title: "Ideeën voor nieuwe projecten uitwerken",
        project: "persoonlijk",
        status: "todo",
        targetDate: null,
        notes: "Staat in de backlog tot er tijd vrij is.",
        daily: false,
        dailyNote: "",
        recurrence: { type: "none", interval: 1, unit: "days", mode: "from_completion" },
        completions: [],
        createdAt: new Date().toISOString()
      }
    ];

    function App() {
      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.map((t) => ({
                ...t,
                project: t.project || "werk",
                daily: Boolean(t.daily),
                dailyNote: t.dailyNote || ""
              }));
            }
          }
        } catch (e) {}
        return INITIAL_TASKS;
      });

      const [feedbackItems, setFeedbackItems] = useState(() => {
        try {
          const saved = localStorage.getItem(FEEDBACK_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return [];
      });

      const [undoStack, setUndoStack] = useState([]);

      const [darkMode, setDarkMode] = useState(() => {
        try {
          const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
          if (savedTheme !== null) return savedTheme === "true";
        } catch (e) {}
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      });

      const [activeProject, setActiveProject] = useState("werk");
      const [viewMode, setViewMode] = useState(() => (window.innerWidth < 768 ? "day" : "split"));
      const [dayLayout, setDayLayout] = useState("focus");
      const [selectedDate, setSelectedDate] = useState(() => toDateStr());
      const [showDoneInDay, setShowDoneInDay] = useState(true);
      const [backlogFilter, setBacklogFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [menuOpen, setMenuOpen] = useState(false);
      // State voor de feedback-pop-up die overal via Ctrl+Shift+F / Cmd+Shift+F geopend kan worden
      const [feedbackModalOpen, setFeedbackModalOpen] = useState(false);
      const [feedbackListModalOpen, setFeedbackListModalOpen] = useState(false);
      const [feedbackDraft, setFeedbackDraft] = useState("");
      const [listFeedbackDraft, setListFeedbackDraft] = useState("");
      const [feedbackCopied, setFeedbackCopied] = useState(false);
      const [feedbackText, setFeedbackText] = useState("");
      const [feedbackEntries, setFeedbackEntries] = useState([]);

      const [newTitle, setNewTitle] = useState("");
      const [newProject, setNewProject] = useState("werk");
      const [newDate, setNewDate] = useState(() => toDateStr());
      const [newNotes, setNewNotes] = useState("");
      const [newDaily, setNewDaily] = useState(false);
      const [newRecType, setNewRecType] = useState("none");
      const [newRecInterval, setNewRecInterval] = useState(1);
      const [newRecUnit, setNewRecUnit] = useState("days");
      const [newRecMode, setNewRecMode] = useState("from_completion");
      const [showNewOptions, setShowNewOptions] = useState(false);

      const [editingTask, setEditingTask] = useState(null);
      const [expandedHistoryIds, setExpandedHistoryIds] = useState({});
      const [expandedNotesIds, setExpandedNotesIds] = useState({});
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [dragOverTarget, setDragOverTarget] = useState(null);
      const [toast, setToast] = useState(null);

      const [fbReady, setFbReady] = useState(Boolean(window.FocusFlowFirebase));
      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("Lokaal");
      const [syncError, setSyncError] = useState("");
      const skipNextCloudWriteRef = useRef(false);
      const fileInputRef = useRef(null);
      const menuRef = useRef(null);
      const editFormRef = useRef(null);
      const feedbackInputRef = useRef(null);

      const todayStr = toDateStr();
      const accent = useMemo(() => getAccentClasses(activeProject), [activeProject]);

      // Globale sneltoets Ctrl+Shift+F / Cmd+Shift+F om overal de feedback-pop-up te openen
      useEffect(() => {
        function handleGlobalFeedbackShortcut(e) {
          const isFeedbackCombo =
            (e.ctrlKey || e.metaKey) &&
            e.shiftKey &&
            !e.altKey &&
            String(e.key || "").toLowerCase() === "f";

          if (!isFeedbackCombo) return;

          e.preventDefault();
          e.stopPropagation();
          setMenuOpen(false);
          setFeedbackModalOpen(true);
        }

        window.addEventListener("keydown", handleGlobalFeedbackShortcut, true);
        return () => window.removeEventListener("keydown", handleGlobalFeedbackShortcut, true);
      }, []);

      // Focus het tekstveld zodra de feedback-pop-up opent
      useEffect(() => {
        if (!feedbackModalOpen) return;
        const timer = setTimeout(() => {
          feedbackInputRef.current?.focus();
        }, 0);
        return () => clearTimeout(timer);
      }, [feedbackModalOpen]);

      useEffect(() => {
        if (activeProject !== "all") {
          setNewProject(activeProject);
        }
      }, [activeProject]);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", darkMode);
        try {
          localStorage.setItem(THEME_STORAGE_KEY, String(darkMode));
        } catch (e) {}
      }, [darkMode]);

      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {}
      }, [tasks]);

      useEffect(() => {
        try {
          localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(feedbackItems));
        } catch (e) {}
      }, [feedbackItems]);

      useEffect(() => {
        if (!menuOpen) return;
        function onDocClick(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) {
            setMenuOpen(false);
          }
        }
        function onKeyDown(e) {
          if (e.key === "Escape") setMenuOpen(false);
        }
        document.addEventListener("mousedown", onDocClick);
        document.addEventListener("keydown", onKeyDown);
        return () => {
          document.removeEventListener("mousedown", onDocClick);
          document.removeEventListener("keydown", onKeyDown);
        };
      }, [menuOpen]);

      useEffect(() => {
        if (window.FocusFlowFirebase) {
          setFbReady(true);
          return;
        }
        const onReady = () => setFbReady(true);
        window.addEventListener("focusflow-firebase-ready", onReady);
        return () => window.removeEventListener("focusflow-firebase-ready", onReady);
      }, []);

      useEffect(() => {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, onAuthStateChanged, signInAnonymously } = window.FocusFlowFirebase;

        const unsub = onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            setSyncError("");
          } else {
            setUser(null);
            try {
              setSyncStatus("Verbinden...");
              await signInAnonymously(auth);
            } catch (err) {
              setSyncStatus("Alleen lokaal");
            }
          }
        });

        return () => unsub();
      }, [fbReady]);

      useEffect(() => {
        if (!fbReady || !window.FocusFlowFirebase || !user) return;
        const { db, doc, onSnapshot } = window.FocusFlowFirebase;

        setSyncStatus("Synchroniseren...");
        const userDocRef = doc(db, "focusflow_users", user.uid);

        const unsub = onSnapshot(
          userDocRef,
          (snap) => {
            setSyncError("");
            if (snap.exists()) {
              const data = snap.data();
              if (Array.isArray(data.tasks)) {
                skipNextCloudWriteRef.current = true;
                setTasks(
                  data.tasks.map((t) => ({
                    ...t,
                    project: t.project || "werk",
                    daily: Boolean(t.daily),
                    dailyNote: t.dailyNote || ""
                  }))
                );
              }
              if (Array.isArray(data.feedback)) {
                setFeedbackItems(data.feedback);
              }
              setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
            } else {
              setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
            }
          },
          (err) => {
            console.error("Firestore fout:", err);
            setSyncStatus("Fout bij sync");
            setSyncError(err.message || "Geen toegang tot Firestore. Controleer je Firestore Rules.");
          }
        );

        return () => unsub();
      }, [fbReady, user]);

      async function saveTasksToCloud(nextTasks, nextFeedback = null) {
        if (!fbReady || !window.FocusFlowFirebase || !user) return;
        const { db, doc, setDoc } = window.FocusFlowFirebase;
        try {
          setSyncStatus("Opslaan...");
          const userDocRef = doc(db, "focusflow_users", user.uid);
          const payload = {
            tasks: nextTasks,
            updatedAt: new Date().toISOString(),
            ownerEmail: user.email || null
          };
          if (Array.isArray(nextFeedback)) {
            payload.feedback = nextFeedback;
          }
          await setDoc(userDocRef, payload, { merge: true });
          setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
          setSyncError("");
        } catch (err) {
          console.error("Opslaan mislukt:", err);
          setSyncStatus("Fout bij opslaan");
          setSyncError(err.message || "Kon niet opslaan in Firestore.");
        }
      }

      function updateFeedbackState(updater) {
        setFeedbackItems((prev) => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          saveTasksToCloud(tasks, next);
          return next;
        });
      }

      function createFeedbackEntry(rawText) {
        const trimmed = (rawText || "").trim();
        if (!trimmed) return null;
        return {
          id: `fb-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: trimmed,
          createdAt: new Date().toISOString(),
          processed: false,
          processedAt: null,
          contextProject: activeProject,
          contextView: viewMode
        };
      }

      function handleSubmitFeedbackModal(e) {
        e.preventDefault();
        const entry = createFeedbackEntry(feedbackDraft);
        if (!entry) return;
        updateFeedbackState((prev) => [entry, ...prev]);
        setFeedbackDraft("");
        setFeedbackModalOpen(false);
        showToast("Feedback opgeslagen in je feedbacklijst");
      }

      function handleAddFeedbackInList(e) {
        e.preventDefault();
        const entry = createFeedbackEntry(listFeedbackDraft);
        if (!entry) return;
        updateFeedbackState((prev) => [entry, ...prev]);
        setListFeedbackDraft("");
        showToast("Feedback toegevoegd");
      }

      function handleToggleFeedbackProcessed(id) {
        const nowIso = new Date().toISOString();
        updateFeedbackState((prev) =>
          prev.map((item) => {
            if (item.id !== id) return item;
            const nextProcessed = !Boolean(item.processed);
            return {
              ...item,
              processed: nextProcessed,
              processedAt: nextProcessed ? nowIso : null
            };
          })
        );
      }

      function handleDeleteFeedback(id) {
        updateFeedbackState((prev) => prev.filter((item) => item.id !== id));
      }

      function handleCopyFeedbackForGemini() {
        const openItems = feedbackItems.filter((f) => !f.processed);
        const targetList = openItems.length > 0 ? openItems : feedbackItems;
        if (targetList.length === 0) return;

        const lines = [
          "Hier is mijn feedbacklijst uit FocusFlow om te verwerken:",
          ...targetList.map((item, idx) => {
            const statusText = item.processed
              ? `verwerkt op ${formatDateTimeNL(item.processedAt)}`
              : "nog niet verwerkt";
            return `${idx + 1}. ${item.text} (toegevoegd: ${formatDateTimeNL(item.createdAt)}, status: ${statusText})`;
          })
        ];
        const output = lines.join("\n");

        const temp = document.createElement("textarea");
        temp.value = output;
        temp.setAttribute("readonly", "");
        temp.style.position = "absolute";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.select();
        try {
          document.execCommand("copy");
          setFeedbackCopied(true);
          setTimeout(() => setFeedbackCopied(false), 2500);
        } catch (err) {
          console.error("Kopiëren mislukt:", err);
        }
        document.body.removeChild(temp);
      }

      function commitTasksChange(updater, actionLabel = "Wijziging") {
        setTasks((prev) => {
          const snapshot = JSON.parse(JSON.stringify(prev));
          const next = typeof updater === "function" ? updater(prev) : updater;
          setUndoStack((stack) => [...stack.slice(-19), { tasks: snapshot, label: actionLabel }]);
          if (skipNextCloudWriteRef.current) {
            skipNextCloudWriteRef.current = false;
          } else {
            saveTasksToCloud(next);
          }
          return next;
        });
      }

      function applyDirectTasksState(nextTasks) {
        setTasks(nextTasks);
        saveTasksToCloud(nextTasks);
      }

      function handleUndo() {
        setUndoStack((stack) => {
          if (stack.length === 0) return stack;
          const lastEntry = stack[stack.length - 1];
          const currentSnapshot = JSON.parse(JSON.stringify(tasks));
          applyDirectTasksState(lastEntry.tasks);
          setToast({
            message: `Ongedaan gemaakt: ${lastEntry.label}`,
            redoTasks: currentSnapshot
          });
          return stack.slice(0, -1);
        });
      }

      function showToast(message, canUndo = false) {
        setToast({ message, canUndo });
      }

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 5000);
        return () => clearTimeout(timer);
      }, [toast]);

      async function handleGoogleLogin() {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, googleProvider, signInWithPopup } = window.FocusFlowFirebase;
        try {
          setSyncError("");
          await signInWithPopup(auth, googleProvider);
          showToast("Ingelogd met Google");
        } catch (err) {
          setSyncError(err.message || "Inloggen met Google is geannuleerd of mislukt.");
        }
      }

      async function handleGoogleLogout() {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, signOut } = window.FocusFlowFirebase;
        try {
          setMenuOpen(false);
          await signOut(auth);
          showToast("Uitgelogd bij Google");
        } catch (err) {
          setSyncError(err.message || "Uitloggen mislukt.");
        }
      }

      function handleAddTask(e) {
        e.preventDefault();
        const trimmed = newTitle.trim();
        if (!trimmed) return;

        const targetProj = activeProject === "all" ? newProject : activeProject;
        const recurrence = {
          type: newRecType,
          interval: Math.max(1, Number(newRecInterval) || 1),
          unit: newRecUnit,
          mode: newRecMode
        };

        const created = {
          id: `t-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          title: trimmed,
          project: targetProj,
          status: "todo",
          targetDate: newDate || null,
          notes: newNotes.trim(),
          daily: Boolean(newDaily),
          dailyNote: "",
          recurrence,
          completions: [],
          createdAt: new Date().toISOString()
        };

        commitTasksChange((prev) => [created, ...prev], `Taak "${trimmed}" toevoegen`);
        setNewTitle("");
        setNewNotes("");
        setNewDaily(false);
        showToast(
          created.targetDate
            ? `Taak gepland op ${formatDutchDate(created.targetDate, todayStr)} (${getProjectLabel(targetProj)})`
            : `Taak toegevoegd aan backlog (${getProjectLabel(targetProj)})`,
          true
        );
      }

      function handleToggleComplete(taskId) {
        const target = tasks.find((t) => t.id === taskId);
        if (!target) return;

        const nowIso = new Date().toISOString();
        const completedOnStr = target.targetDate || todayStr;
        const hasRecurrence = target.recurrence && target.recurrence.type !== "none";

        commitTasksChange(
          (prev) =>
            prev.map((t) => {
              if (t.id !== taskId) return t;

              if (t.status === "done") {
                const nextCompletions = Array.isArray(t.completions) ? t.completions.slice(0, -1) : [];
                return {
                  ...t,
                  status: "todo",
                  targetDate: t.targetDate || todayStr,
                  completions: nextCompletions
                };
              }

              const prevCompletions = Array.isArray(t.completions) ? t.completions : [];
              const nextCompletions = [
                ...prevCompletions,
                {
                  completedAt: nowIso,
                  scheduledDate: t.targetDate || todayStr
                }
              ];

              const nextDaily = hasRecurrence ? Boolean(t.daily) : true;

              if (hasRecurrence) {
                const nextDue = computeNextDueDate(t, completedOnStr);
                return {
                  ...t,
                  status: "todo",
                  targetDate: nextDue,
                  daily: nextDaily,
                  lastCompletedAt: nowIso,
                  completions: nextCompletions
                };
              }

              return {
                ...t,
                status: "done",
                targetDate: t.targetDate || todayStr,
                daily: nextDaily,
                completedAt: nowIso,
                completions: nextCompletions
              };
            }),
          `Status van "${target.title}"`
        );

        if (target.status === "todo" && hasRecurrence) {
          const nextDue = computeNextDueDate(target, completedOnStr);
          showToast(
            `"${target.title}" afgerond • Volgende datum: ${formatDutchDate(nextDue, todayStr)}`,
            true
          );
        } else if (target.status === "todo") {
          showToast(`"${target.title}" afgerond en toegevoegd aan Daily`, true);
        } else {
          showToast(`"${target.title}" weer op To do gezet`, true);
        }
      }

      function handleToggleDaily(taskId) {
        const target = tasks.find((t) => t.id === taskId);
        if (!target) return;
        const nextDaily = !Boolean(target.daily);
        commitTasksChange(
          (prev) => prev.map((t) => (t.id === taskId ? { ...t, daily: nextDaily } : t)),
          `Daily ${nextDaily ? "aan" : "uit"} voor "${target.title}"`
        );
        showToast(
          nextDaily
            ? `"${target.title}" gemarkeerd voor Daily`
            : `"${target.title}" uit Daily gehaald`,
          true
        );
      }

      function handleDailyNoteChange(taskId, noteText) {
        setTasks((prev) =>
          prev.map((t) => (t.id === taskId ? { ...t, dailyNote: noteText } : t))
        );
      }

      function handleDailyNoteBlur(taskId, noteText) {
        const current = tasks.find((t) => t.id === taskId);
        if (!current) return;
        saveTasksToCloud(
          tasks.map((t) => (t.id === taskId ? { ...t, dailyNote: noteText } : t))
        );
      }

      function handleSetTargetDate(taskId, nextDate) {
        const target = tasks.find((t) => t.id === taskId);
        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              t.id === taskId
                ? {
                    ...t,
                    status: "todo",
                    targetDate: nextDate || null
                  }
                : t
            ),
          `Datum van "${target?.title || "taak"}"`
        );
        if (nextDate) {
          showToast(`Gepland op ${formatDutchDate(nextDate, todayStr)}`, true);
        } else {
          showToast("Verplaatst naar de backlog", true);
        }
      }

      function handleMoveRemainingDayTasksToTomorrow(sourceDateStr) {
        const tomorrowStr = addDaysStr(sourceDateStr, 1);
        const matchingIds = new Set(
          projectTasks
            .filter((t) => t.status === "todo" && t.targetDate === sourceDateStr)
            .map((t) => t.id)
        );
        if (matchingIds.size === 0) return;

        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              matchingIds.has(t.id) ? { ...t, targetDate: tomorrowStr } : t
            ),
          `Resterende taken van ${formatDutchDate(sourceDateStr, todayStr)} naar morgen`
        );
        showToast(
          `${matchingIds.size} resterende ${matchingIds.size === 1 ? "taak" : "taken"} verplaatst naar ${formatDutchDate(tomorrowStr, todayStr)}`,
          true
        );
      }

      function handleMoveAllOverdueToToday() {
        const overdueIds = new Set(overdueTasks.map((t) => t.id));
        if (overdueIds.size === 0) return;
        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              overdueIds.has(t.id) ? { ...t, targetDate: todayStr, status: "todo" } : t
            ),
          "Alle overdue taken naar vandaag"
        );
        showToast(`${overdueIds.size} overdue taken verplaatst naar Vandaag`, true);
      }

      function handleDeleteTask(taskId) {
        const deleted = tasks.find((t) => t.id === taskId);
        commitTasksChange(
          (prev) => prev.filter((t) => t.id !== taskId),
          `"${deleted?.title || "Taak"}" verwijderen`
        );
        if (editingTask?.id === taskId) setEditingTask(null);
        showToast(`"${deleted?.title || "Taak"}" verwijderd`, true);
      }

      function handleSaveEdit(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (!editingTask || !editingTask.title.trim()) return;

        commitTasksChange(
          (prev) =>
            prev.map((t) =>
              t.id === editingTask.id
                ? {
                    ...t,
                    title: editingTask.title.trim(),
                    project: editingTask.project || "werk",
                    targetDate: editingTask.targetDate || null,
                    notes: (editingTask.notes || "").trim(),
                    daily: Boolean(editingTask.daily),
                    dailyNote: editingTask.dailyNote || "",
                    status: editingTask.status || "todo",
                    recurrence: editingTask.recurrence || {
                      type: "none",
                      interval: 1,
                      unit: "days",
                      mode: "from_completion"
                    }
                  }
                : t
            ),
          `Bewerken van "${editingTask.title.trim()}"`
        );
        setEditingTask(null);
        showToast("Taak bijgewerkt", true);
      }

      // Sla feedback op en sluit de pop-up
      function handleSubmitFeedback(e) {
        if (e && e.preventDefault) e.preventDefault();
        const trimmed = feedbackText.trim();
        if (!trimmed) return;

        const entry = {
          id: `fb-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: trimmed,
          createdAt: new Date().toISOString(),
          processed: false,
          processedAt: null
        };

        setFeedbackEntries((prev) => [entry, ...prev]);

      function toggleHistoryExpand(taskId) {
        setExpandedHistoryIds((prev) => ({ ...prev, [taskId]: !prev[taskId] }));
      }

        setExpandedNotesIds((prev) => ({ ...prev, [taskId]: !prev[taskId] }));
      }

      function handleExportJson() {
        setMenuOpen(false);
        const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `focusflow-backup-${todayStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Backup (JSON) gedownload");
      }

      function handleImportJson(e) {
        setMenuOpen(false);
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!Array.isArray(parsed)) throw new Error("Ongeldig formaat");
            const normalized = parsed.map((t) => ({
              ...t,
              project: t.project || "werk",
              daily: Boolean(t.daily),
              dailyNote: t.dailyNote || ""
            }));
            commitTasksChange(normalized, "JSON-import");
            showToast(`${normalized.length} taken geïmporteerd`, true);
          } catch {
            setSyncError("Kon het JSON-bestand niet inlezen.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

      const projectTasks = useMemo(() => {
        if (activeProject === "all") return tasks;
        return tasks.filter((t) => (t.project || "werk") === activeProject);
      }, [tasks, activeProject]);

      const weekDays = useMemo(() => {
        const base = parseDateStr(selectedDate) || new Date();
        const list = [];
        for (let i = -1; i <= 5; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          list.push(toDateStr(d));
        }
        return list;
      }, [selectedDate]);

      const filteredTasks = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return projectTasks;
        return projectTasks.filter(
          (t) =>
            t.title.toLowerCase().includes(q) ||
            (t.notes && t.notes.toLowerCase().includes(q)) ||
            (t.dailyNote && t.dailyNote.toLowerCase().includes(q))
        );
      }, [projectTasks, searchQuery]);

      const overdueTasks = useMemo(() => {
        return filteredTasks.filter(
          (t) => t.status === "todo" && t.targetDate && t.targetDate < todayStr
        );
      }, [filteredTasks, todayStr]);

      const selectedDateTodoTasks = useMemo(() => {
        return filteredTasks.filter(
          (t) => t.status === "todo" && t.targetDate === selectedDate
        );
      }, [filteredTasks, selectedDate]);

      const selectedDateDoneTasks = useMemo(() => {
        return filteredTasks.filter((t) => {
          if (t.status === "done" && (t.targetDate === selectedDate || (!t.targetDate && selectedDate === todayStr))) {
            return true;
          }
          if (Array.isArray(t.completions)) {
            return t.completions.some((c) => {
              const cDate = c.completedAt ? toDateStr(new Date(c.completedAt)) : c.scheduledDate;
              return cDate === selectedDate;
            });
          }
          return false;
        });
      }, [filteredTasks, selectedDate, todayStr]);

      const dailyMarkedTasks = useMemo(() => {
        return filteredTasks.filter((t) => Boolean(t.daily));
      }, [filteredTasks]);

      const todayPlannedTasks = useMemo(() => {
        return filteredTasks.filter((t) => t.targetDate === todayStr);
      }, [filteredTasks, todayStr]);

      const backlogTasks = useMemo(() => {
        return filteredTasks.filter((t) => t.status === "todo" && !t.targetDate).filter((t) => {
          if (backlogFilter === "recurring") return t.recurrence && t.recurrence.type !== "none";
          if (backlogFilter === "notes") return hasMarkdownContent(t.notes);
          return true;
        });
      }, [filteredTasks, backlogFilter]);

      const upcomingDaysList = useMemo(() => {
        return Array.from({ length: 7 }, (_, idx) => addDaysStr(todayStr, idx));
      }, [todayStr]);

      const logbookEntriesByDate = useMemo(() => {
        const entries = [];
        for (const t of filteredTasks) {
          if (Array.isArray(t.completions) && t.completions.length > 0) {
            t.completions.forEach((c, idx) => {
              const dtStr = c.completedAt ? toDateStr(new Date(c.completedAt)) : c.scheduledDate || todayStr;
              entries.push({
                key: `${t.id}-${idx}-${c.completedAt || idx}`,
                taskId: t.id,
                title: t.title,
                project: t.project || "werk",
                completedAt: c.completedAt,
                dateStr: dtStr,
                isRecurring: Boolean(t.recurrence && t.recurrence.type !== "none"),
                nextDue: t.targetDate
              });
            });
          } else if (t.status === "done") {
            const dtStr = t.completedAt ? toDateStr(new Date(t.completedAt)) : t.targetDate || todayStr;
            entries.push({
              key: `${t.id}-done`,
              taskId: t.id,
              title: t.title,
              project: t.project || "werk",
              completedAt: t.completedAt,
              dateStr: dtStr,
              isRecurring: false,
              nextDue: null
            });
          }
        }

        entries.sort((a, b) => {
          if (a.completedAt && b.completedAt) {
            return new Date(b.completedAt) - new Date(a.completedAt);
          }
          return b.dateStr.localeCompare(a.dateStr);
        });

        const grouped = new Map();
        for (const item of entries) {
          if (!grouped.has(item.dateStr)) grouped.set(item.dateStr, []);
          grouped.get(item.dateStr).push(item);
        }
        return Array.from(grouped.entries());
      }, [filteredTasks, todayStr]);

                      )}

                      <div>
                        <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                          Nieuwe datum berekenen
                        </label>
                        <select
                          value={editingTask.recurrence?.mode || "from_completion"}
                          onChange={(e) =>
                            setEditingTask({
                              ...editingTask,
                              recurrence: {
                                ...editingTask.recurrence,
                                mode: e.target.value
                              }
                            })
                          }
                          className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                        >
                          <option value="from_completion">Vanaf afronddatum</option>
                          <option value="from_due">Vaste cadans vanaf geplande datum</option>
                        </select>
                      </div>
                    </div>
                  )}

                  <div className="flex items-center justify-between rounded-xl border border-slate-200/80 bg-slate-50 px-3.5 py-2.5 dark:border-slate-800 dark:bg-slate-950/60">
                    <div>
                      <div className="text-xs font-semibold text-slate-800 dark:text-slate-200">
                        Daily
                      </div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Toon deze taak in het Daily-overzicht voor je dagelijkse update
                      </div>
                    </div>
                    <input
                      type="checkbox"
                      checked={Boolean(editingTask.daily)}
                      onChange={(e) =>
                        setEditingTask({ ...editingTask, daily: e.target.checked })
                      }
                      className="h-4 w-4 rounded border-slate-300"
                    />
                  </div>

                  <div>
                    <div className="mb-1.5 flex items-center justify-between gap-2">
                      <label className="block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Notities
                      </label>
                      <span className="text-[11px] text-slate-400">
                        Ctrl/Cmd+Enter om op te slaan
                      </span>
                    </div>
                    <DirectMarkdownEditor
                      value={editingTask.notes || ""}
                      onChange={(nextNotes) =>
                        setEditingTask((prev) => (prev ? { ...prev, notes: nextNotes } : null))
                      }
                      onSaveShortcut={() => editFormRef.current?.requestSubmit()}
                    />
                  </div>
                </div>

                <div className="flex shrink-0 items-center justify-end gap-2 border-t border-slate-100 px-6 py-4 dark:border-slate-800">
                  <button
                    type="button"
                    onClick={() => setEditingTask(null)}
                    className="rounded-xl border border-slate-200 px-4 py-2 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
                  >
                    Annuleren
                  </button>
                  <button
                    type="submit"
                    className={`rounded-xl px-4 py-2 text-xs font-semibold transition ${accent.primaryBtn}`}
                  >
                    Opslaan
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Feedback pop-up (ook bereikbaar via Ctrl+Shift+F / Cmd+Shift+F) */}
          {feedbackModalOpen && (
            <div
              onClick={() => setFeedbackModalOpen(false)}
              className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-xs"
            >
              <form
                onClick={(e) => e.stopPropagation()}
                onSubmit={handleSubmitFeedback}
                className="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-xl dark:border-slate-800 dark:bg-slate-900"
              >
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <h3 className="text-base font-bold">Feedback geven</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Sneltoets: Ctrl+Shift+F (of Cmd+Shift+F)
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setFeedbackModalOpen(false)}
                    className="rounded-lg px-2 py-1 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                  >
                    ✕
                  </button>
                </div>

                <div className="mt-4">
                  <label className="mb-1.5 block text-xs font-medium text-slate-600 dark:text-slate-400">
                    Jouw feedback of idee voor FocusFlow
                  </label>
                  <textarea
                    ref={feedbackInputRef}
                    rows="5"
                    value={feedbackText}
                    onChange={(e) => setFeedbackText(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Escape") {
                        e.preventDefault();
                        setFeedbackModalOpen(false);
                      } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                        e.preventDefault();
                        handleSubmitFeedback(e);
                      }
                    }}
                    placeholder="Beschrijf wat je wilt verbeteren of toevoegen..."
                    className={`w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none ${accent.focusRing} dark:border-slate-700 dark:bg-slate-950`}
                    required
                  />
                </div>

                <div className="mt-5 flex items-center justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setFeedbackModalOpen(false)}
                    className="rounded-xl border border-slate-200 px-4 py-2 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
                  >
                    Annuleren
                  </button>
                  <button
                    type="submit"
                    className={`rounded-xl px-4 py-2 text-xs font-semibold transition ${accent.primaryBtn}`}
                  >
                    Feedback opslaan
                  </button>
                </div>
              </form>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-xl bg-slate-900 px-4 py-2.5 text-xs font-medium text-white shadow-lg dark:bg-slate-100 dark:text-slate-900">
              <span>{toast.message}</span>
              {toast.canUndo && (
                <button
                  type="button"
                  onClick={() => {
                    handleUndo();
                    setToast(null);
                  }}
                  className="underline font-bold"
                >
                  Ongedaan maak
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    function mountFocusFlowApp() {
      const rootElement = document.getElementById("root");
      if (!rootElement) return;
      rootElement.replaceChildren();
      const appMountNode = document.createElement("div");
      appMountNode.setAttribute("data-focusflow-mount", "true");
      rootElement.appendChild(appMountNode);
      const root = ReactDOM.createRoot(appMountNode);
      root.render(<App />);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountFocusFlowApp, { once: true });
    } else {
      mountFocusFlowApp();
    }
  </script>
</body>
</html>
