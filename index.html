  <style>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-500/20 selection:text-indigo-500">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInAnonymously,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCe2-lt0HcVofzHCdhgxugJv6F8DOJgi50",
      authDomain: "focusflow-f4a6e.firebaseapp.com",
      projectId: "focusflow-f4a6e",
      storageBucket: "focusflow-f4a6e.firebasestorage.app",
      messagingSenderId: "846663129847",
      appId: "1:846663129847:web:4a9fd1defbf8241b7b51f2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    window.FocusFlowFirebase = {
      auth,
      db,
      googleProvider,
      signInWithPopup,
      signInAnonymously,
      signOut,
      onAuthStateChanged,
      doc,
      setDoc,
      onSnapshot
    };
    window.dispatchEvent(new Event("focusflow-firebase-ready"));
  </script>

  <!-- Modulaire FocusFlow-bestanden in vaste laadvolgorde -->
  <script type="text/babel" src="focusflow-ui-icons.js"></script>
  <script type="text/babel" src="focusflow-dates-markdown.js"></script>
  <script type="text/babel" src="focusflow-invoices.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const {
      PROJECTS,
      getAccentClasses,
      getProjectBadgeClasses,
      getProjectLabel,
      FocusFlowMark,
      DailySunIcon,
      EditPencilIcon,
      DeleteTrashIcon
    } = window.FocusFlowUI;

    const {
      toDateStr,
      parseDateStr,
      addDaysStr,
      computeNextDueDate,
      formatRecurrenceLabel,
      formatDutchDate,
      formatFullDutchDate,
      formatDateTimeNL,
      formatTimeOnlyNL,
      markdownToEditorHtml,
      hasMarkdownContent,
      DirectMarkdownEditor
    } = window.FocusFlowDatesMarkdown;

    const LOCAL_STORAGE_KEY = "focusflow_tasks_v3";
    const THEME_STORAGE_KEY = "focusflow_theme_v1";
    const FEEDBACK_STORAGE_KEY = "focusflow_feedback_v1";
    const INVOICES_STORAGE_KEY = "focusflow_invoices_v1";
    const INVOICE_DEFAULTS_STORAGE_KEY = "focusflow_invoice_defaults_v1";

    function readJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        return JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function writeJsonStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function cloneValue(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeTask(task) {
      return {
        ...task,
        project: task.project || "werk",
        daily: Boolean(task.daily),
        dailyNote: task.dailyNote || ""
      };
    }

    const INITIAL_TASKS = [
      {
        id: "t-1",
        title: "Weekprioriteiten bepalen in FocusFlow",
        project: "werk",
        status: "todo",
        targetDate: toDateStr(),
        notes: "## Belangrijkste punten\n- Kies maximaal 3 kerntaken voor vandaag\n- Controleer openstaande deadlines",
        daily: false,
        dailyNote: "",
        recurrence: { type: "weekly", interval: 1, unit: "weeks", mode: "from_completion" },
        completions: [],
        createdAt: new Date().toISOString()
      },
      {
        id: "t-2",
        title: "Bezoekverslag Verburch verwerken",
        project: "verburch",
        status: "todo",
        targetDate: toDateStr(),
        notes: "- Actiepunten uitzetten\n- Koppelen aan lopende afspraken",
        daily: true,
        dailyNote: "Kort toelichten in de daily.",
        recurrence: { type: "weekdays", interval: 1, unit: "days", mode: "from_completion" },
        completions: [],
        createdAt: new Date().toISOString()
      },
      {
        id: "t-3",
        title: "Ideeën voor nieuwe projecten uitwerken",
        project: "persoonlijk",
        status: "todo",
        targetDate: null,
        notes: "Staat in de backlog tot er tijd vrij is.",
        daily: false,
        dailyNote: "",
        recurrence: { type: "none", interval: 1, unit: "days", mode: "from_completion" },
        completions: [],
        createdAt: new Date().toISOString()
      }
    ];

    function App() {
      const invoiceModule = window.FocusFlowInvoices || {};
      const InvoicesSection = invoiceModule.FocusFlowInvoicesSection || null;

      const [tasks, setTasks] = useState(() => {
        const saved = readJsonStorage(LOCAL_STORAGE_KEY, null);
        if (Array.isArray(saved)) return saved.map(normalizeTask);
        return INITIAL_TASKS;
      });

      const [invoices, setInvoices] = useState(() => {
        const saved = readJsonStorage(INVOICES_STORAGE_KEY, []);
        return Array.isArray(saved) ? saved : [];
      });

      const [invoiceDefaults, setInvoiceDefaults] = useState(() => {
        const fallback = invoiceModule.DEFAULT_INVOICE_DEFAULTS || {
          senderName: "SV Verburch",
          senderAddress: "",
          paymentInfo: "",
          defaultPaymentLink: "",
          presetLines: []
        };
        const saved = readJsonStorage(INVOICE_DEFAULTS_STORAGE_KEY, null);
        if (saved && typeof saved === "object") {
          return invoiceModule.normalizeInvoiceDefaults
            ? invoiceModule.normalizeInvoiceDefaults(saved)
            : { ...fallback, ...saved };
        }
        return fallback;
      });

      const [feedbackItems, setFeedbackItems] = useState(() => {
        const saved = readJsonStorage(FEEDBACK_STORAGE_KEY, []);
        return Array.isArray(saved) ? saved : [];
      });

      const [undoStack, setUndoStack] = useState([]);

      const [darkMode, setDarkMode] = useState(() => {
        try {
          const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
          if (savedTheme !== null) return savedTheme === "true";
        } catch {}
        return Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      });

      const [activeProject, setActiveProject] = useState("werk");
      const [viewMode, setViewMode] = useState(() => (window.innerWidth < 768 ? "day" : "split"));
      const [dayLayout, setDayLayout] = useState("focus");
      const [selectedDate, setSelectedDate] = useState(() => toDateStr());
      const [showDoneInDay, setShowDoneInDay] = useState(true);
      const [backlogFilter, setBacklogFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [menuOpen, setMenuOpen] = useState(false);
      const [feedbackModalOpen, setFeedbackModalOpen] = useState(false);
      const [feedbackListModalOpen, setFeedbackListModalOpen] = useState(false);
      const [listFeedbackDraft, setListFeedbackDraft] = useState("");
      const [feedbackCopied, setFeedbackCopied] = useState(false);
      const [feedbackText, setFeedbackText] = useState("");

      const [newTitle, setNewTitle] = useState("");
      const [newProject, setNewProject] = useState("werk");
      const [newDate, setNewDate] = useState(() => toDateStr());
      const [newNotes, setNewNotes] = useState("");
      const [newDaily, setNewDaily] = useState(false);
      const [newRecType, setNewRecType] = useState("none");
      const [newRecInterval, setNewRecInterval] = useState(1);
      const [newRecUnit, setNewRecUnit] = useState("days");
      const [newRecMode, setNewRecMode] = useState("from_completion");
      const [showNewOptions, setShowNewOptions] = useState(false);

      const [editingTask, setEditingTask] = useState(null);
      const [expandedHistoryIds, setExpandedHistoryIds] = useState({});
      const [expandedNotesIds, setExpandedNotesIds] = useState({});
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [dragOverTarget, setDragOverTarget] = useState(null);
      const [toast, setToast] = useState(null);

      const [fbReady, setFbReady] = useState(Boolean(window.FocusFlowFirebase));
      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("Lokaal");
      const [syncError, setSyncError] = useState("");
      const skipNextCloudWriteRef = useRef(false);
      const skipNextCloudFeedbackRef = useRef(false);
      const skipNextCloudInvoicesRef = useRef(false);
      const fileInputRef = useRef(null);
      const menuRef = useRef(null);
      const editFormRef = useRef(null);
      const feedbackInputRef = useRef(null);

      const todayStr = toDateStr();
      const accent = useMemo(() => getAccentClasses(activeProject), [activeProject]);

      useEffect(() => {
        if (activeProject !== "verburch" && viewMode === "invoices") {
          setViewMode(window.innerWidth < 768 ? "day" : "split");
        }
      }, [activeProject, viewMode]);

      const closeFeedbackModalWithoutSave = useCallback(() => {
        setFeedbackModalOpen(false);
      }, []);

      const closeFeedbackListModalWithoutSave = useCallback(() => {
        setFeedbackListModalOpen(false);
        setFeedbackCopied(false);
      }, []);

      const closeEditModalWithoutSave = useCallback(() => {
        setEditingTask(null);
      }, []);

      useEffect(() => {
        const hasOpenModal = feedbackModalOpen || feedbackListModalOpen || Boolean(editingTask);
        if (!hasOpenModal) return;

        function handleModalEscape(e) {
          if (e.key !== "Escape") return;
          e.preventDefault();
          e.stopPropagation();

          if (feedbackModalOpen) {
            closeFeedbackModalWithoutSave();
          } else if (feedbackListModalOpen) {
            closeFeedbackListModalWithoutSave();
          } else if (editingTask) {
            closeEditModalWithoutSave();
          }
        }

        window.addEventListener("keydown", handleModalEscape, true);
        return () => window.removeEventListener("keydown", handleModalEscape, true);
      }, [
        feedbackModalOpen,
        feedbackListModalOpen,
        editingTask,
        closeFeedbackModalWithoutSave,
        closeFeedbackListModalWithoutSave,
        closeEditModalWithoutSave
      ]);

      useEffect(() => {
        function handleGlobalFeedbackShortcut(e) {
          const isFeedbackCombo =
            (e.ctrlKey || e.metaKey) &&
            e.shiftKey &&
            !e.altKey &&
            String(e.key || "").toLowerCase() === "f";

          if (!isFeedbackCombo) return;

          e.preventDefault();
          e.stopPropagation();
          setMenuOpen(false);
          setFeedbackModalOpen(true);
        }

        window.addEventListener("keydown", handleGlobalFeedbackShortcut, true);
        return () => window.removeEventListener("keydown", handleGlobalFeedbackShortcut, true);
      }, []);

      useEffect(() => {
        if (!feedbackModalOpen) return;
        const timer = setTimeout(() => {
          feedbackInputRef.current?.focus();
        }, 0);
        return () => clearTimeout(timer);
      }, [feedbackModalOpen]);

      useEffect(() => {
        if (activeProject !== "all") {
          setNewProject(activeProject);
        }
      }, [activeProject]);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", darkMode);
        try {
          localStorage.setItem(THEME_STORAGE_KEY, String(darkMode));
        } catch {}
      }, [darkMode]);

      useEffect(() => {
        writeJsonStorage(LOCAL_STORAGE_KEY, tasks);
      }, [tasks]);

      useEffect(() => {
        writeJsonStorage(INVOICES_STORAGE_KEY, invoices);
      }, [invoices]);

      useEffect(() => {
        writeJsonStorage(INVOICE_DEFAULTS_STORAGE_KEY, invoiceDefaults);
      }, [invoiceDefaults]);

      useEffect(() => {
        writeJsonStorage(FEEDBACK_STORAGE_KEY, feedbackItems);
      }, [feedbackItems]);

      useEffect(() => {
        if (!menuOpen) return;
        function onDocClick(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) {
            setMenuOpen(false);
          }
        }
        function onKeyDown(e) {
          if (e.key === "Escape") setMenuOpen(false);
        }
        document.addEventListener("mousedown", onDocClick);
        document.addEventListener("keydown", onKeyDown);
        return () => {
          document.removeEventListener("mousedown", onDocClick);
          document.removeEventListener("keydown", onKeyDown);
        };
      }, [menuOpen]);

      useEffect(() => {
        if (window.FocusFlowFirebase) {
          setFbReady(true);
          return;
        }
        const onReady = () => setFbReady(true);
        window.addEventListener("focusflow-firebase-ready", onReady);
        return () => window.removeEventListener("focusflow-firebase-ready", onReady);
      }, []);

      useEffect(() => {
        if (!fbReady || !window.FocusFlowFirebase) return;
        const { auth, onAuthStateChanged, signInAnonymously } = window.FocusFlowFirebase;

        const unsub = onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            setSyncError("");
          } else {
            setUser(null);
            try {
              setSyncStatus("Verbinden...");
              await signInAnonymously(auth);
            } catch {
              setSyncStatus("Alleen lokaal");
            }
          }
        });

        return () => unsub();
      }, [fbReady]);

      useEffect(() => {
        if (!fbReady || !window.FocusFlowFirebase || !user) return;
        const { db, doc, onSnapshot } = window.FocusFlowFirebase;

        setSyncStatus("Synchroniseren...");
        const userDocRef = doc(db, "focusflow_users", user.uid);

        const unsub = onSnapshot(
          userDocRef,
          (snap) => {
            setSyncError("");
            if (snap.exists()) {
              const data = snap.data();
              if (Array.isArray(data.tasks)) {
                skipNextCloudWriteRef.current = true;
                setTasks(data.tasks.map(normalizeTask));
              }
              if (Array.isArray(data.invoices)) {
                skipNextCloudInvoicesRef.current = true;
                setInvoices(data.invoices);
              }
              if (data.invoiceDefaults && typeof data.invoiceDefaults === "object") {
                skipNextCloudInvoicesRef.current = true;
                setInvoiceDefaults(
                  invoiceModule.normalizeInvoiceDefaults
                    ? invoiceModule.normalizeInvoiceDefaults(data.invoiceDefaults)
                    : data.invoiceDefaults
                );
              }
              if (Array.isArray(data.feedback)) {
                skipNextCloudFeedbackRef.current = true;
                setFeedbackItems(data.feedback);
              }
              setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
            } else {
              setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
            }
          },
          (err) => {
            console.error("Firestore fout:", err);
            setSyncStatus("Fout bij sync");
            setSyncError(err.message || "Geen toegang tot Firestore. Controleer je Firestore Rules.");
          }
        );

        return () => unsub();
      }, [fbReady, user, invoiceModule]);

      async function saveTasksToCloud(
        nextTasks,
        nextFeedback = null,
        nextInvoices = null,
        nextInvoiceDefaults = null
      ) {
        if (!fbReady || !window.FocusFlowFirebase || !user) return;
        const { db, doc, setDoc } = window.FocusFlowFirebase;
        try {
          setSyncStatus("Opslaan...");
          const userDocRef = doc(db, "focusflow_users", user.uid);
          const payload = {
            tasks: nextTasks,
            updatedAt: new Date().toISOString(),
            ownerEmail: user.email || null
          };
          if (Array.isArray(nextFeedback)) payload.feedback = nextFeedback;
          if (Array.isArray(nextInvoices)) payload.invoices = nextInvoices;
          if (nextInvoiceDefaults && typeof nextInvoiceDefaults === "object") {
            payload.invoiceDefaults = nextInvoiceDefaults;
          }
          await setDoc(userDocRef, payload, { merge: true });
          setSyncStatus(user.isAnonymous ? "Cloud (anoniem)" : "Cloud");
          setSyncError("");
        } catch (err) {
          console.error("Opslaan mislukt:", err);
          setSyncStatus("Fout bij opslaan");
          setSyncError(err.message || "Kon niet opslaan in Firestore.");
        }
      }

      function updateInvoicesState(updater, nextDefaultsOverride = null) {
        setInvoices((prev) => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          writeJsonStorage(INVOICES_STORAGE_KEY, next);
          if (skipNextCloudInvoicesRef.current) {
            skipNextCloudInvoicesRef.current = false;
          } else {
            saveTasksToCloud(tasks, null, next, nextDefaultsOverride);
          }
          return next;
        });
      }

      function handleSaveInvoice(record, isNew) {
        updateInvoicesState((prev) => {
          if (isNew) return [record, ...prev];
          const exists = prev.some((item) => item.id === record.id);
          return exists
            ? prev.map((item) => (item.id === record.id ? record : item))
            : [record, ...prev];
        });
        showToast(
          isNew
            ? `Factuur ${record.invoiceNumber} aangemaakt`
            : `Factuur ${record.invoiceNumber} opgeslagen`
        );
      }

      function handleDeleteInvoice(invoiceId) {
        const target = invoices.find((item) => item.id === invoiceId);
        updateInvoicesState((prev) => prev.filter((item) => item.id !== invoiceId));
        showToast(`Factuur ${target?.invoiceNumber || ""} verwijderd`);
      }

      function handleUpdateInvoiceQuick(invoiceId, patch) {
        updateInvoicesState((prev) =>
          prev.map((item) =>
            item.id === invoiceId
              ? { ...item, ...patch, updatedAt: new Date().toISOString() }
              : item
          )
        );
        showToast("Factuurstatus bijgewerkt");
      }

      function handleSaveInvoiceDefaults(nextDefaults) {
        setInvoiceDefaults(nextDefaults);
        writeJsonStorage(INVOICE_DEFAULTS_STORAGE_KEY, nextDefaults);
        saveTasksToCloud(tasks, null, invoices, nextDefaults);
        showToast("Standaardinstellingen voor facturen opgeslagen");
      }

      function updateFeedbackState(updater) {
        setFeedbackItems((prev) => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          writeJsonStorage(FEEDBACK_STORAGE_KEY, next);
          if (skipNextCloudFeedbackRef.current) {
            skipNextCloudFeedbackRef.current = false;
          } else {
            saveTasksToCloud(tasks, next);
          }
          return next;
        });
      }

      function createFeedbackEntry(rawText) {
        const trimmed = (rawText || "").trim();
        if (!trimmed) return null;
        return {
          id: `fb-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: trimmed,
          createdAt: new Date().toISOString(),
          processed: false,
          processedAt: null,
          contextProject: activeProject,
          contextView: viewMode
        };
      }

      function handleSubmitFeedbackModal(e) {
        if (e && e.preventDefault) e.preventDefault();
        const entry = createFeedbackEntry(feedbackText);
        if (!entry) return;
        updateFeedbackState((prev) => [entry, ...prev]);
        setFeedbackText("");
        setFeedbackModalOpen(false);
        showToast("Feedback opgeslagen in je feedbacklijst");
      }

      function handleAddFeedbackInList(e) {
        e.preventDefault();
        const entry = createFeedbackEntry(listFeedbackDraft);
        if (!entry) return;
        updateFeedbackState((prev) => [entry, ...prev]);
        setListFeedbackDraft("");
        showToast("Feedback toegevoegd");
      }

      function handleToggleFeedbackProcessed(id) {
        const nowIso = new Date().toISOString();
        updateFeedbackState((prev) =>
          prev.map((item) => {
            if (item.id !== id) return item;
            const nextProcessed = !Boolean(item.processed);
            return {
              ...item,
              processed: nextProcessed,
              processedAt: nextProcessed ? nowIso : null
            };
          })
        );
      }

      function handleDeleteFeedback(id) {
        updateFeedbackState((prev) => prev.filter((item) => item.id !== id));
      }

      function handleCopyFeedbackForGemini() {
        const openItems = feedbackItems.filter((f) => !f.processed);
        const targetList = openItems.length > 0 ? openItems : feedbackItems;
        if (targetList.length === 0) return;

        const lines = [
          "Hier is mijn feedbacklijst uit FocusFlow om te verwerken:",
          ...targetList.map((item, idx) => {
            const statusText = item.processed
              ? `verwerkt op ${formatDateTimeNL(item.processedAt)}`
              : "nog niet verwerkt";
            return `${idx + 1}. ${item.text} (toegevoegd: ${formatDateTimeNL(item.createdAt)}, status: ${statusText})`;
          })
        ];
        const output = lines.join("\n");

        const temp = document.createElement("textarea");
        temp.value = output;
        temp.setAttribute("readonly", "");
        temp.style.position = "absolute";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.select();
        try {
          document.execCommand("copy");
          setFeedbackCopied(true);
          setTimeout(() => setFeedbackCopied(false), 2500);
        } catch (err) {
          console.error("Kopiëren mislukt:", err);
        }
        document.body.removeChild(temp);
      }

      function commitTasksChange(updater, actionLabel = "Wijziging") {
        setTasks((prev) => {
          const snapshot = cloneValue(prev);
          const next = typeof updater === "function" ? updater(prev) : updater;
          setUndoStack((stack) => [...stack.slice(-19), { tasks: snapshot, label: actionLabel }]);
          if (skipNextCloudWriteRef.current) {
            skipNextCloudWriteRef.current = false;
          } else {
            saveTasksToCloud(next);
          }
          return next;
        });
      }

      function applyDirectTasksState(nextTasks) {
        setTasks(nextTasks);
        saveTasksToCloud(nextTasks);
      }

      function handleUndo() {
        setUndoStack((stack) => {
          if (stack.length === 0) return stack;
          const lastEntry = stack[stack.length - 1];
          const currentSnapshot = cloneValue(tasks);
          applyDirectTasksState(lastEntry.tasks);
          setToast({
            message: `Ongedaan gemaakt: ${lastEntry.label}`,
            redoTasks: currentSnapshot
          });
          return stack.slice(0, -1);
        });
      }

      function handleToggleComplete(taskId) {
        const target = tasks.find((t) => t.id === taskId);
        if (!target) return;

        const nowIso = new Date().toISOString();
        const completedOnStr = target.targetDate || todayStr;
        const hasRecurrence = target.recurrence && target.recurrence.type !== "none";

        commitTasksChange(
          (prev) =>
            prev.map((t) => {
              if (t.id !== taskId) return t;

              if (t.status === "done") {
                const nextCompletions = Array.isArray(t.completions) ? t.completions.slice(0, -1) : [];
                return {
                  ...t,
                  status: "todo",
                  targetDate: t.targetDate || todayStr,
                  completions: nextCompletions
                };
              }

              const prevCompletions = Array.isArray(t.completions) ? t.completions : [];
              const nextCompletions = [
                ...prevCompletions,
                {
                  completedAt: nowIso,
                  scheduledDate: t.targetDate || todayStr
                }
              ];

              const nextDaily = hasRecurrence ? Boolean(t.daily) : true;

              if (hasRecurrence) {
                const nextDue = computeNextDueDate(t, completedOnStr);
                return {
                  ...t,
                  status: "todo",
                  targetDate: nextDue,
                  daily: nextDaily,
                  lastCompletedAt: nowIso,
                  completions: nextCompletions
                };
              }

              return {
                ...t,
                status: "done",
                targetDate: t.targetDate || todayStr,
                daily: nextDaily,
                completedAt: nowIso,
                completions: nextCompletions
              };
            }),
          `Status van "${target.title}"`
        );

        if (target.status === "todo" && hasRecurrence) {
          const nextDue = computeNextDueDate(target, completedOnStr);
          showToast(
            `"${target.title}" afgerond • Volgende datum: ${formatDutchDate(nextDue, todayStr)}`,
            true
          );
        } else if (target.status === "todo") {
          showToast(`"${target.title}" afgerond en toegevoegd aan Daily`, true);
        } else {
          showToast(`"${target.title}" weer op To do gezet`, true);
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);

      const logbookEntriesByDate = useMemo(() => {
        const entries = [];
        for (const t of filteredTasks) {
          if (Array.isArray(t.completions) && t.completions.length > 0) {
            t.completions.forEach((c, idx) => {
              const dtStr = c.completedAt
                ? toDateStr(new Date(c.completedAt))
                : c.scheduledDate || todayStr;
              entries.push({
                key: `${t.id}-${idx}-${c.completedAt || idx}`,
                taskId: t.id,
                title: t.title,
                project: t.project || "werk",
                completedAt: c.completedAt,
                dateStr: dtStr,
                isRecurring: Boolean(t.recurrence && t.recurrence.type !== "none"),
                nextDue: t.targetDate
              });
            });
          } else if (t.status === "done") {
            const dtStr = t.completedAt ? toDateStr(new Date(t.completedAt)) : t.targetDate || todayStr;
            entries.push({
              key: `${t.id}-done`,
              taskId: t.id,
              title: t.title,
              project: t.project || "werk",
              completedAt: t.completedAt,
              dateStr: dtStr,
              isRecurring: false,
              nextDue: null
            });
          }
        }

        entries.sort((a, b) => {
          if (a.completedAt && b.completedAt) {
            return new Date(b.completedAt) - new Date(a.completedAt);
          }
          return b.dateStr.localeCompare(a.dateStr);
        });

        const grouped = new Map();
        for (const item of entries) {
          if (!grouped.has(item.dateStr)) grouped.set(item.dateStr, []);
          grouped.get(item.dateStr).push(item);

                                    isProcessed
                                      ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300"
                                      : "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300"
                                  }`}
                                >
                                  {isProcessed ? "Verwerkt" : "Niet verwerkt"}
                                </span>
                                <span className="text-[11px] text-slate-400">
                                  Toegevoegd: {formatDateTimeNL(item.createdAt)}
                                </span>
                                {isProcessed && item.processedAt && (
                                  <span className="text-[11px] text-emerald-700 dark:text-emerald-400">
                                    • Verwerkt op: {formatDateTimeNL(item.processedAt)}
                                  </span>
                                )}
                              </div>
                              <p className="mt-2 whitespace-pre-line text-sm text-slate-800 dark:text-slate-100">
                                {item.text}
                              </p>
                            </div>

                            <div className="flex shrink-0 items-center gap-1.5">
                              <button
                                type="button"
                                onClick={() => handleToggleFeedbackProcessed(item.id)}
                                className="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-medium text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800"
                              >
                                {isProcessed ? "Markeer open" : "Markeer verwerkt"}
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteFeedback(item.id)}
                                aria-label="Feedback verwijderen"
                                title="Feedback verwijderen"
                                className="inline-flex h-7 w-7 items-center justify-center rounded-lg text-slate-400 hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-950/50 dark:hover:text-rose-400"
                              >
                                <DeleteTrashIcon className="h-4 w-4" />
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                <div className="flex shrink-0 justify-end border-t border-slate-100 px-6 py-3.5 dark:border-slate-800">
                  <button
                    type="button"
                    onClick={closeFeedbackListModalWithoutSave}
                    className="rounded-xl border border-slate-200 px-4 py-2 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
                  >
                    Sluiten
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingTask && (
            <div
              onClick={closeEditModalWithoutSave}
              className="fixed inset-0 z-40 flex items-center justify-center bg-black/50 p-4 backdrop-blur-xs"
            >
              <form
                ref={editFormRef}
                onClick={(e) => e.stopPropagation()}
                onSubmit={handleSaveEdit}
                className="flex max-h-[90vh] w-full max-w-xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-800 dark:bg-slate-900"
              >
                <div className="flex shrink-0 items-center justify-between border-b border-slate-100 px-6 py-4 dark:border-slate-800">
                  <h3 className="text-base font-bold">Taak bewerken</h3>
                  <button
                    type="button"
                    onClick={closeEditModalWithoutSave}
                    className="rounded-lg px-2 py-1 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 space-y-4 overflow-y-auto px-6 py-4">
                  <div>
                    <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                      Titel
                    </label>
                    <input
                      type="text"
                      value={editingTask.title}
                      onChange={(e) =>
                        setEditingTask({ ...editingTask, title: e.target.value })
                      }
                      className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                      required
                    />
                  </div>

                  <div className="grid gap-3 sm:grid-cols-2">
                    <div>
                      <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Project
                      </label>
                      <select
                        value={editingTask.project || "werk"}
                        onChange={(e) =>
                          setEditingTask({ ...editingTask, project: e.target.value })
                        }
                        className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                      >
                        {PROJECTS.map((p) => (
                          <option key={p.id} value={p.id}>
                            {p.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Status
                      </label>
                      <select
                        value={editingTask.status || "todo"}
                        onChange={(e) =>
                          setEditingTask({ ...editingTask, status: e.target.value })
                        }
                        className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                      >
                        <option value="todo">To do</option>
                        <option value="done">Done</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid gap-3 sm:grid-cols-2">
                    <div>
                      <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Datum (leeg = backlog)
                      </label>
                      <div className="flex items-center gap-2">
                        <input
                          type="date"
                          value={editingTask.targetDate || ""}
                          onChange={(e) =>
                            setEditingTask({
                              ...editingTask,
                              targetDate: e.target.value || null
                            })
                          }
                          className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                        />
                        {editingTask.targetDate && (
                          <button
                            type="button"
                            onClick={() => setEditingTask({ ...editingTask, targetDate: null })}
                            className="shrink-0 rounded-xl border border-slate-200 px-2.5 py-2 text-xs text-slate-600 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
                          >
                            Backlog
                          </button>
                        )}
                      </div>
                    </div>

                    <div>
                      <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Herhaling (cadans)
                      </label>
                      <select
                        value={editingTask.recurrence?.type || "none"}
                        onChange={(e) =>
                          setEditingTask({
                            ...editingTask,
                            recurrence: {
                              ...(editingTask.recurrence || {
                                interval: 1,
                                unit: "days",
                                mode: "from_completion"
                              }),
                              type: e.target.value
                            }
                          })
                        }
                        className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                      >
                        <option value="none">Niet herhalend</option>
                        <option value="daily">Dagelijks</option>
                        <option value="weekdays">Werkdagen (ma–vr)</option>
                        <option value="weekly">Wekelijks</option>
                        <option value="biweekly">Elke 2 weken</option>
                        <option value="monthly">Maandelijks</option>
                        <option value="custom">Aangepast interval...</option>
                      </select>
                    </div>
                  </div>

                  {editingTask.recurrence?.type && editingTask.recurrence.type !== "none" && (
                    <div className="grid gap-3 sm:grid-cols-2">
                      {editingTask.recurrence?.type === "custom" ? (
                        <div className="flex gap-2">
                          <div className="w-24">
                            <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                              Elke
                            </label>
                            <input
                              type="number"
                              min="1"
                              value={editingTask.recurrence?.interval || 1}
                              onChange={(e) =>
                                setEditingTask({
                                  ...editingTask,
                                  recurrence: {
                                    ...editingTask.recurrence,
                                    interval: Math.max(1, Number(e.target.value) || 1)
                                  }
                                })
                              }
                              className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                            />
                          </div>
                          <div className="flex-1">
                            <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                              Eenheid
                            </label>
                            <select
                              value={editingTask.recurrence?.unit || "days"}
                              onChange={(e) =>
                                setEditingTask({
                                  ...editingTask,
                                  recurrence: {
                                    ...editingTask.recurrence,
                                    unit: e.target.value
                                  }
                                })
                              }
                              className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                            >
                              <option value="days">Dagen</option>
                              <option value="weeks">Weken</option>
                              <option value="months">Maanden</option>
                            </select>
                          </div>
                        </div>
                      ) : (
                        <div className="hidden sm:block" />
                      )}

                      <div>
                        <label className="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">
                          Nieuwe datum berekenen
                        </label>
                        <select
                          value={editingTask.recurrence?.mode || "from_completion"}
                          onChange={(e) =>
                            setEditingTask({
                              ...editingTask,
                              recurrence: {
                                ...editingTask.recurrence,
                                mode: e.target.value
                              }
                            })
                          }
                          className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-950"
                        >
                          <option value="from_completion">Vanaf afronddatum</option>
                          <option value="from_due">Vaste cadans vanaf geplande datum</option>
                        </select>
                      </div>
                    </div>
                  )}

                  <div className="flex items-center justify-between rounded-xl border border-slate-200/80 bg-slate-50 px-3.5 py-2.5 dark:border-slate-800 dark:bg-slate-950/60">
                    <div>
                      <div className="text-xs font-semibold text-slate-800 dark:text-slate-200">
                        Daily
                      </div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Toon deze taak in het Daily-overzicht voor je dagelijkse update
                      </div>
                    </div>
                    <input
                      type="checkbox"
                      checked={Boolean(editingTask.daily)}
                      onChange={(e) =>
                        setEditingTask({ ...editingTask, daily: e.target.checked })
                      }
                      className="h-4 w-4 rounded border-slate-300"
                    />
                  </div>

                  <div>
                    <div className="mb-1.5 flex items-center justify-between gap-2">
                      <label className="block text-xs font-medium text-slate-600 dark:text-slate-400">
                        Notities
                      </label>
                      <span className="text-[11px] text-slate-400">
                        Ctrl/Cmd+Enter om op te slaan
                      </span>
                    </div>
                    <DirectMarkdownEditor
                      value={editingTask.notes || ""}
                      onChange={(nextNotes) =>
                        setEditingTask((prev) => (prev ? { ...prev, notes: nextNotes } : null))
                      }
                      onSaveShortcut={() => editFormRef.current?.requestSubmit()}
                    />
                  </div>
                </div>

                <div className="flex shrink-0 items-center justify-end gap-2 border-t border-slate-100 px-6 py-4 dark:border-slate-800">
                  <button
                    type="button"
                    onClick={closeEditModalWithoutSave}
                    className="rounded-xl border border-slate-200 px-4 py-2 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
                  >
                    Annuleren
                  </button>
                  <button
                    type="submit"
                    className={`rounded-xl px-4 py-2 text-xs font-semibold transition ${accent.primaryBtn}`}
                  >
                    Opslaan
                  </button>
                </div>
              </form>
            </div>
          )}

          {feedbackModalOpen && (
            <div
              onClick={closeFeedbackModalWithoutSave}
              className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-xs"
            >
              <form
                onClick={(e) => e.stopPropagation()}
                onSubmit={handleSubmitFeedbackModal}
                className="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-xl dark:border-slate-800 dark:bg-slate-900"
              >
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <h3 className="text-base font-bold">Feedback geven</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Sneltoets: Ctrl+Shift+F (of Cmd+Shift+F) • Noteer een verbeterpunt of wens
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={closeFeedbackModalWithoutSave}
                    className="rounded-lg px-2 py-1 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                  >
                    ✕
                  </button>
                </div>

                <div className="mt-4">
                  <label className="mb-1.5 block text-xs font-medium text-slate-600 dark:text-slate-400">
                    Jouw feedback of idee voor FocusFlow
                  </label>
                  <textarea
                    ref={feedbackInputRef}
                    rows="5"
                    value={feedbackText}
                    onChange={(e) => setFeedbackText(e.target.value)}
                    onKeyDown={(e) => {
                      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                        e.preventDefault();
                        handleSubmitFeedbackModal(e);
                      }
                    }}
                    placeholder="Beschrijf wat je wilt verbeteren of toevoegen..."
                    className={`w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none ${accent.focusRing} dark:border-slate-700 dark:bg-slate-950`}
                    required
                  />
                </div>

                <div className="mt-5 flex items-center justify-end gap-2">
                  <button
                    type="button"
                    onClick={closeFeedbackModalWithoutSave}
                    className="rounded-xl border border-slate-200 px-4 py-2 text-xs font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
                  >
                    Annuleren
                  </button>
                  <button
                    type="submit"
                    className={`rounded-xl px-4 py-2 text-xs font-semibold transition ${accent.primaryBtn}`}
                  >
                    Feedback opslaan
                  </button>
                </div>
              </form>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-xl bg-slate-900 px-4 py-2.5 text-xs font-medium text-white shadow-lg dark:bg-slate-100 dark:text-slate-900">
              <span>{toast.message}</span>
              {toast.canUndo && (
                <button
                  type="button"
                  onClick={() => {
                    handleUndo();
                    setToast(null);
                  }}
                  className="underline font-bold"
                >
                  Ongedaan maak
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    function mountFocusFlowApp() {
      const rootElement = document.getElementById("root");
      if (!rootElement) return;
      rootElement.replaceChildren();
      const appMountNode = document.createElement("div");
      appMountNode.setAttribute("data-focusflow-mount", "true");
      rootElement.appendChild(appMountNode);
      const root = ReactDOM.createRoot(appMountNode);
      root.render(<App />);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountFocusFlowApp, { once: true });
    } else {
      mountFocusFlowApp();
    }
  </script>
</body>
</html>
